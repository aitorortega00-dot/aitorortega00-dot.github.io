<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KUBEL Oficina</title>
<meta name="theme-color" content="#1F4E5F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="iconos/favicon.png">
<link rel="apple-touch-icon" href="iconos/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KUBEL Oficina">
<script src="../comun/config.js"></script>
<script src="../comun/cargar-supabase.js"></script>
<script src="../comun/avisos.js"></script>
<style>
  :root{
    --fondo:#F3F1EC; --tarjeta:#fff; --texto:#1E2328; --suave:#5F6770; --borde:#E2DED6;
    --marca:#1F4E5F; --marca-suave:#E3ECEF; --acento:#E07A1F; --peligro:#C0392B; --ok:#2E7D4F; --azul:#1B5A8C;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--fondo);color:var(--texto)}
  a{color:var(--marca)}
  button,input,select,textarea{font:inherit}
  button{cursor:pointer;border-radius:8px;border:1.5px solid var(--marca);background:var(--marca);color:#fff;padding:7px 14px;font-weight:600}
  button.sec{background:#fff;color:var(--marca)}
  button.acento{background:var(--acento);border-color:var(--acento)}
  button.peligro{background:#fff;color:var(--peligro);border-color:var(--peligro)}
  button.mini{padding:3px 9px;font-size:12px}
  button:disabled{opacity:.5;cursor:default}
  input,select,textarea{border:1px solid var(--borde);border-radius:8px;padding:7px 10px;background:#FAFAF8;color:var(--texto);width:100%}
  textarea{min-height:80px;resize:vertical}
  label{display:block;font-weight:600;font-size:12px;color:var(--suave);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.4px}
  .oculto{display:none!important}

  header{background:var(--marca);color:#fff;display:flex;align-items:center;gap:20px;padding:0 20px;padding-top:env(safe-area-inset-top);min-height:56px;position:sticky;top:0;z-index:5}
  header .logo{font-weight:800;letter-spacing:3px;font-size:18px;white-space:nowrap}
  header .logo small{font-weight:600;letter-spacing:1px;font-size:11px;color:#C9DCE2;margin-left:6px}
  header nav{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none}
  header nav::-webkit-scrollbar{display:none}
  header nav a{color:#C9DCE2;text-decoration:none;padding:8px 12px;border-radius:8px;font-weight:600;white-space:nowrap;position:relative}
  header nav a.activo,header nav a:hover{background:rgba(255,255,255,.12);color:#fff}
  .badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--acento);color:#fff;font-size:11px;line-height:18px;text-align:center;margin-left:4px}
  header .usuario{font-size:13px;color:#C9DCE2;white-space:nowrap;display:flex;align-items:center;gap:8px}
  header .usuario button{background:transparent;border-color:#C9DCE2;color:#fff}
  .vivo{width:8px;height:8px;border-radius:50%;background:#7FD19B;display:inline-block}
  .vivo.off{background:#E8A598}

  main{padding:20px;max-width:1500px;margin:0 auto}
  .barra{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
  .barra h2{margin:0 12px 0 0;font-size:20px}
  .barra .esp{flex:1}
  .tarjeta{background:var(--tarjeta);border:1px solid var(--borde);border-radius:12px;padding:16px}

  .centro{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--marca);padding:20px}
  .caja{background:#fff;border-radius:16px;padding:28px;width:100%;max-width:400px}
  .caja h1{margin:0;color:var(--marca);letter-spacing:4px;text-align:center}
  .caja p{color:var(--suave);text-align:center;margin:4px 0 12px}
  .caja button{width:100%;margin-top:18px;padding:11px}
  .error{color:var(--peligro);margin-top:10px;font-size:13px}
  .nota{background:#FFF4E5;color:#8A4B00;border-radius:8px;padding:10px;font-size:13px}

  /* Hoy */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
  .kpi{background:#fff;border:1px solid var(--borde);border-radius:12px;padding:14px 16px;text-decoration:none;color:inherit;display:block}
  .kpi:hover{border-color:var(--marca)}
  .kpi .n{font-size:30px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
  .kpi .t{font-size:12px;color:var(--suave);text-transform:uppercase;letter-spacing:.4px;font-weight:600}
  .kpi.alerta .n{color:var(--acento)}
  .kpi.mal .n{color:var(--peligro)}
  .hoy-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;align-items:start}
  .op-hoy{margin-bottom:12px}
  .op-hoy .cab{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .op-hoy .cab b{font-size:15px}
  .op-hoy .cab .esp{flex:1}
  .progreso{height:6px;background:#ECEAE4;border-radius:3px;overflow:hidden;margin-bottom:10px}
  .progreso div{height:100%;background:var(--ok)}
  .visita{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--borde);cursor:pointer}
  .visita:hover{background:#FAF8F3}
  .visita .h{width:44px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--suave)}
  .visita .d{flex:1;min-width:0}
  .visita .d div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .feed .item{padding:10px 0;border-top:1px solid var(--borde);cursor:pointer}
  .feed .item:first-of-type{border-top:0}
  .feed .item:hover{background:#FAF8F3}
  .feed .item .txt{color:var(--suave);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

  /* Planificación */
  .plan{display:grid;grid-template-columns:260px 1fr;gap:16px;align-items:start}
  .sin-plan{position:sticky;top:76px;max-height:calc(100vh - 96px);overflow:auto}
  .sin-plan h3{margin:0 0 8px;font-size:14px}
  .rejilla{overflow:auto;background:#fff;border:1px solid var(--borde);border-radius:12px}
  .rejilla table{border-collapse:collapse;width:100%;min-width:900px;table-layout:fixed}
  .rejilla th,.rejilla td{border-bottom:1px solid var(--borde);border-right:1px solid var(--borde);vertical-align:top;padding:6px}
  .rejilla th{background:#FAFAF8;font-size:12px;text-transform:capitalize;color:var(--suave);position:sticky;top:0}
  .rejilla th.hoy{background:var(--marca-suave);color:var(--marca)}
  .rejilla td.op{font-weight:700;width:130px;background:#FAFAF8}
  .rejilla td.celda{height:90px}
  .rejilla td.celda.sobre{background:#FFF4E5}
  .rejilla td.hoy{background:#F7FAFB}
  .chip{background:var(--marca-suave);border-left:4px solid var(--marca);border-radius:6px;padding:4px 6px;margin-bottom:5px;font-size:12px;cursor:grab;line-height:1.3}
  .chip b{display:block}
  .chip .dir{color:var(--suave);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chip.urgente{border-left-color:var(--peligro)}
  .chip.hecho{opacity:.55;border-left-color:var(--ok)}
  .chip.no_realizado{border-left-color:var(--peligro);background:#F8DEDA}
  .chip.en_camino{border-left-color:var(--azul);background:#DCEBF7}
  .anadir{display:block;width:100%;background:transparent;border:1px dashed var(--borde);color:var(--suave);padding:2px;font-weight:400;font-size:12px}
  .anadir:hover{border-color:var(--marca);color:var(--marca)}
  .leyenda{display:flex;gap:14px;font-size:12px;color:var(--suave);margin-top:10px;flex-wrap:wrap}
  .leyenda span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;background:var(--c)}

  table.lista{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--borde);border-radius:12px;overflow:hidden}
  table.lista th,table.lista td{padding:9px 10px;border-bottom:1px solid var(--borde);text-align:left;vertical-align:top}
  table.lista th{background:#FAFAF8;font-size:12px;color:var(--suave);text-transform:uppercase}
  table.lista tr.clic:hover{background:#FAF8F3;cursor:pointer}
  .et{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;background:#ECEAE4;color:#4A5058;white-space:nowrap}
  .et.pendiente{background:#FDEBD8;color:#9A4E0B}
  .et.asignado{background:var(--marca-suave);color:var(--marca)}
  .et.en_curso,.et.en_camino{background:#DCEBF7;color:var(--azul)}
  .et.terminado,.et.hecho,.et.revisado{background:#DDF0E3;color:var(--ok)}
  .et.anulado,.et.no_realizado,.et.urg{background:#F8DEDA;color:#A33224}
  .et.nuevo{background:var(--acento);color:#fff}

  .informe{margin-bottom:12px}
  .informe.sin-revisar{border-left:4px solid var(--acento)}
  .informe .cab{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
  .informe .cab b{font-size:15px}
  .informe .cab .esp{flex:1}
  .informe .txt{white-space:pre-wrap}
  .fotos{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .fotos a{position:relative;display:block}
  .fotos img{width:110px;height:110px;object-fit:cover;border-radius:8px;border:1px solid var(--borde);background:var(--borde)}
  .fotos span{position:absolute;left:4px;bottom:4px;background:rgba(0,0,0,.65);color:#fff;font-size:10px;padding:1px 5px;border-radius:4px;text-transform:uppercase}

  .velo{position:fixed;inset:0;background:rgba(20,25,30,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:20}
  .modal{background:#fff;border-radius:14px;width:100%;max-width:640px;padding:22px}
  .modal.ancho{max-width:860px}
  .modal h3{margin:0 0 6px}
  .modal .acciones{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
  .modal .acciones .esp{flex:1}
  .dos{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
  .tres{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 12px}
  .check{display:flex;gap:8px;align-items:center;margin-top:12px}
  .check input{width:auto}
  .aviso{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--texto);color:#fff;padding:10px 18px;border-radius:10px;z-index:30;font-weight:600;max-width:calc(100vw - 32px)}
  .vacio{color:var(--suave);padding:20px;text-align:center}

  .visor{position:fixed;inset:0;background:rgba(10,12,14,.92);z-index:40;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:16px}
  .visor img{max-width:100%;max-height:calc(100vh - 110px);border-radius:6px}
  .visor .barra-v{display:flex;gap:10px;align-items:center;color:#fff}
  .visor button{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3)}

  /* SIGMA */
  .sigma-ind{font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;cursor:pointer;white-space:nowrap;background:rgba(255,255,255,.12);color:#fff}
  .sigma-ind.ok::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#7FD19B;margin-right:6px;vertical-align:1px}
  .sigma-ind.viejo::before,.sigma-ind.mal::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#F2C14E;margin-right:6px;vertical-align:1px}
  .sigma-ind.mal{background:#C0392B}
  .et.sigma{background:#E7E3F4;color:#4B3B8F}
  .punto{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:0}
  .punto.rojo{background:#D9534F}.punto.amarillo{background:#E6B325}.punto.verde{background:#4CAF6E}
  .sigma-caja{background:#F7F5FC;border:1px solid #E1DCF0;border-radius:10px;padding:12px 14px;margin:12px 0 4px}
  .sigma-caja .cab{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
  .sigma-caja .cab .esp{flex:1}
  .sigma-datos{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:4px 14px;font-size:13px}
  .sigma-datos span{color:var(--suave)}
  .tels{margin-top:8px;font-size:13px}
  .tels a{font-weight:700;text-decoration:none}
  .bitacora{max-height:260px;overflow:auto;background:#fff;border:1px solid var(--borde);border-radius:8px;padding:4px 10px;margin-top:6px;font-size:13px}
  .bitacora div{padding:6px 0;border-top:1px solid var(--borde);white-space:pre-wrap}
  .bitacora div:first-child{border-top:0}
  .bitacora b{color:#4B3B8F;font-variant-numeric:tabular-nums}
  details summary{cursor:pointer;font-weight:600;font-size:13px;margin-top:10px}
  .envio{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px;cursor:pointer}
  .envio:hover{border-color:var(--marca)}
  .envio .d{flex:1;min-width:0}
  .envio .t{font-weight:700}
  .envio .c{color:var(--suave);white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .envio .r{font-size:12px;margin-top:4px}
  .envio .r.ok{color:var(--ok)}.envio .r.mal{color:var(--peligro)}
  .envio .acc{display:flex;flex-direction:column;gap:6px}
  .pest{display:flex;gap:6px;flex-wrap:wrap}
  .pest button{background:#fff;color:var(--marca)}
  .pest button.activo{background:var(--marca);color:#fff}
  .et.borrador{background:#FDEBD8;color:#9A4E0B}.et.aprobado,.et.enviando{background:#DCEBF7;color:var(--azul)}
  .et.enviado{background:#DDF0E3;color:var(--ok)}.et.error{background:#F8DEDA;color:#A33224}.et.descartado{background:#ECEAE4;color:#6B7178}

  @media (max-width:1000px){.hoy-grid{grid-template-columns:1fr}}
  @media (max-width:900px){
    .plan{grid-template-columns:1fr}.sin-plan{position:static;max-height:none}
    header{gap:10px;padding:0 10px;flex-wrap:wrap}
    header nav{order:3;flex-basis:100%;padding-bottom:6px}
    header .logo small{display:none}
    main{padding:14px}
    table.lista .opc{display:none}
  }
  @media (max-width:560px){.dos,.tres{grid-template-columns:1fr}.velo{padding:12px 8px}.modal{padding:16px}}
</style>
</head>
<body>

<div id="v-carga" class="centro"><div style="color:#fff;font-weight:700;letter-spacing:3px">KUBEL…</div></div>

<div id="v-login" class="centro oculto">
  <form class="caja" onsubmit="entrar(event)">
    <h1>KUBEL</h1><p>Oficina</p>
    <label>Correo</label><input id="lg-correo" type="email" autocomplete="username" required>
    <label>Contraseña</label><input id="lg-clave" type="password" autocomplete="current-password" required>
    <div id="lg-error" class="error"></div>
    <button id="lg-btn">Entrar</button>
    <p style="margin-top:14px;font-size:12px">¿Eres operario? <a href="../operario/">Ir a la app de operarios</a></p>
  </form>
</div>

<div id="v-app" class="oculto">
  <header>
    <div class="logo">KUBEL<small>OFICINA</small></div>
    <nav>
      <a href="#hoy" data-v="hoy">Hoy</a>
      <a href="#plan" data-v="plan">Planificación</a>
      <a href="#partes" data-v="partes">Partes</a>
      <a href="#informes" data-v="informes">Informes<span id="b-inf" class="badge oculto"></span></a>
      <a href="#envios" data-v="envios">Envíos a SIGMA<span id="b-env" class="badge oculto"></span></a>
      <a href="#operarios" data-v="operarios">Operarios</a>
    </nav>
    <div class="usuario"><span id="sigma-ind" class="sigma-ind oculto" onclick="modalSigma()" title="Robot SIGMA: última lectura del portal"></span><span id="vivo" class="vivo off" title="Actualización en directo"></span><button class="mini" id="btn-avisos" onclick="alternarAvisos()" title="Avisos en este dispositivo">🔕</button><span id="yo"></span></div>
  </header>
  <main id="contenido"></main>
</div>

<div id="modal"></div>
<div id="visor"></div>
<div id="aviso" class="aviso oculto"></div>

<script>
/* =====================================================================
   KUBEL Oficina — v2.3 (robot SIGMA + envíos a SIGMA)
   Web accesible desde cualquier sitio. Datos en Supabase.
   ===================================================================== */

// ---------- Utilidades ----------
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const dos = (n) => String(n).padStart(2, '0');
const aISO = (d) => `${d.getFullYear()}-${dos(d.getMonth() + 1)}-${dos(d.getDate())}`;
const deISO = (s) => { const [a, m, d] = s.split('-').map(Number); return new Date(a, m - 1, d); };
const sumar = (iso, n) => { const d = deISO(iso); d.setDate(d.getDate() + n); return aISO(d); };
const hoyISO = () => aISO(new Date());
const DIAS = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
const DIAS_L = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const fCorta = (iso) => { const d = deISO(iso); return `${DIAS[d.getDay()]} ${d.getDate()} ${MESES[d.getMonth()]}`; };
const fLarga = (iso) => { const d = deISO(iso); return `${DIAS_L[d.getDay()]} ${d.getDate()} ${MESES[d.getMonth()]}`; };
const hCorta = (h) => (h ? h.slice(0, 5) : '');
const fHora = (ts) => { const d = new Date(ts); return `${dos(d.getDate())}/${dos(d.getMonth() + 1)}/${d.getFullYear()} ${dos(d.getHours())}:${dos(d.getMinutes())}`; };
const hace = (ts) => {
  const m = Math.round((Date.now() - new Date(ts)) / 60000);
  if (m < 1) return 'ahora'; if (m < 60) return `hace ${m} min`;
  const h = Math.round(m / 60); if (h < 24) return `hace ${h} h`;
  return fHora(ts);
};
const euros = (n) => Number(n).toFixed(2).replace('.', ',') + ' €';
const lunesDe = (iso) => { const d = deISO(iso); const dia = (d.getDay() + 6) % 7; d.setDate(d.getDate() - dia); return aISO(d); };
const ESTADOS_PARTE = ['pendiente', 'asignado', 'en_curso', 'terminado', 'cerrado', 'anulado'];
const TXT_ESTADO = { pendiente: 'Pendiente', asignado: 'Asignado', en_curso: 'En curso', terminado: 'Terminado', cerrado: 'Cerrado', anulado: 'Anulado', en_camino: 'En camino', hecho: 'Hecho', no_realizado: 'No realizado' };
const GREMIOS = ['Fontanería', 'Albañilería', 'Pintura', 'Electricidad', 'Carpintería'];
const dirCompleta = (p) => [p?.direccion, p?.codigo_postal, p?.poblacion].filter(Boolean).join(', ');

function aviso(txt) { const a = $('#aviso'); a.textContent = txt; a.classList.remove('oculto'); clearTimeout(aviso.t); aviso.t = setTimeout(() => a.classList.add('oculto'), 3200); }
function mensaje(e) {
  const m = e?.message || String(e);
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return 'Sin conexión con el servidor. Comprueba internet.';
  if (/JWT expired/i.test(m)) return 'La sesión ha caducado. Vuelve a entrar.';
  return m;
}
function fallo(e) { console.error(e); alert('Error: ' + mensaje(e)); }
function cerrarModal() { $('#modal').innerHTML = ''; }
function abrirModal(html, ancho) {
  $('#modal').innerHTML = `<div class="velo" onclick="if(event.target===this)cerrarModal()"><div class="modal ${ancho ? 'ancho' : ''}">${html}</div></div>`;
}
function val(id) { return $('#' + id).value.trim(); }
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if ($('#visor').innerHTML) cerrarVisor(); else cerrarModal(); } });

// ---------- Conexión ----------
let sb = null;
let yo = null;
let cache = { operarios: [], companias: [], todosPerfiles: [], codigos: {}, sinc: [] };
let vistaActual = 'hoy';

function mostrar(id) { ['v-carga', 'v-login', 'v-app'].forEach((v) => $('#' + v).classList.toggle('oculto', v !== id)); }

function alFallarSupabase() {
  $('#v-carga').innerHTML = '<div class="caja"><h1>KUBEL</h1><p>No se pudo conectar. Comprueba internet y recarga la página.</p><button onclick="location.reload()">Recargar</button></div>';
}
function alCargarSupabase() {
  if (sb) return;
  const c = window.KUBEL_CONFIG;
  sb = window.supabase.createClient(c.url, c.key);
  sb.auth.onAuthStateChange((_ev, sesion) => { setTimeout(() => alCambiarSesion(sesion), 0); });
}
if (window.KUBEL_SB === 'listo') alCargarSupabase(); else if (window.KUBEL_SB === 'error') alFallarSupabase();
document.addEventListener('supabase-listo', alCargarSupabase);
document.addEventListener('supabase-error', alFallarSupabase);

let sesionActual;
async function alCambiarSesion(sesion) {
  const id = sesion?.user?.id ?? null;
  if (id === sesionActual) return;
  sesionActual = id;
  if (!id) { yo = null; pararTiempoReal(); return mostrar('v-login'); }
  const { data, error } = await sb.from('perfiles').select('*').eq('id', id).single();
  if (error || !data) { alert('No se encontró tu perfil.'); return sb.auth.signOut({ scope: 'local' }); }
  if (data.rol !== 'oficina' || !data.activo) {
    // Solo cierra la sesión en este navegador; no afecta a otros dispositivos
    await sb.auth.signOut({ scope: 'local' });
    $('#lg-error').innerHTML = !data.activo ? 'Esta cuenta está desactivada.'
      : data.rol === 'admin' ? 'Esta cuenta es de administrador: entra por <a href="../admin/">el panel de administrador</a>.'
      : 'Esta cuenta es de operario: entra por <a href="../operario/">la app de operarios</a>.';
    return;
  }
  yo = data;
  $('#yo').textContent = yo.nombre;
  mostrar('v-app');
  await cargarCatalogos();
  arrancarTiempoReal();
  contarSinRevisar();
  contarEnvios();
  KubelAvisos.sincronizar(sb).then(pintarBotonAvisos);
  irA(location.hash.slice(1) || 'hoy');
}

async function entrar(ev) {
  ev.preventDefault();
  $('#lg-error').textContent = ''; $('#lg-btn').disabled = true;
  const { error } = await sb.auth.signInWithPassword({ email: ((c) => c && !c.includes('@') ? c + '@kubel.app' : c)(val('lg-correo').toLowerCase()), password: $('#lg-clave').value });
  $('#lg-btn').disabled = false;
  if (error) $('#lg-error').textContent = /Invalid login/i.test(error.message) ? 'Correo o contraseña incorrectos.' : mensaje(error);
}
async function pintarBotonAvisos() {
  const b = $('#btn-avisos'); if (!b) return;
  if (!KubelAvisos.soportado()) { b.classList.add('oculto'); return; }
  const on = await KubelAvisos.activos();
  b.textContent = on ? '🔔' : '🔕';
  b.title = on ? 'Avisos activados en este dispositivo (pulsa para desactivar)' : 'Activar avisos en este dispositivo';
}
async function alternarAvisos() {
  try {
    if (await KubelAvisos.activos()) { await KubelAvisos.desactivar(sb); aviso('Avisos desactivados en este dispositivo'); }
    else { await KubelAvisos.activar(sb); aviso('🔔 Avisos activados: te llegarán los informes y las visitas no realizadas'); }
  } catch (e) { alert(mensaje(e)); }
  pintarBotonAvisos();
}

async function cargarCatalogos() {
  const [o, c] = await Promise.all([
    sb.from('perfiles').select('*').order('nombre'),
    sb.from('companias').select('*').order('nombre'),
  ]);
  cache.todosPerfiles = (o.data || []).filter((p) => p.rol !== 'admin'); // las cuentas admin solo se ven en /admin/
  cache.operarios = cache.todosPerfiles.filter((p) => p.rol === 'operario' && p.activo);
  cache.companias = c.data || [];
  const { data: cods } = await sb.from('sigma_codigos').select('tipo, codigo, texto');
  cache.codigos = {};
  (cods || []).forEach((x) => (cache.codigos[x.tipo + ':' + x.codigo] = x.texto));
  cargarSigma();
}
const nombreDe = (id) => cache.todosPerfiles.find((p) => p.id === id)?.nombre || '—';

// ---------- Tiempo real ----------
let canal = null, recargaT = null;
function arrancarTiempoReal() {
  pararTiempoReal();
  canal = sb.channel('oficina')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'asignaciones' }, (p) => alCambio('asignaciones', p))
    .on('postgres_changes', { event: '*', schema: 'public', table: 'informes' }, (p) => alCambio('informes', p))
    .on('postgres_changes', { event: '*', schema: 'public', table: 'partes' }, (p) => alCambio('partes', p))
    .on('postgres_changes', { event: '*', schema: 'public', table: 'sigma_sincronizaciones' }, () => cargarSigma())
    .on('postgres_changes', { event: '*', schema: 'public', table: 'sigma_envios' }, (p) => alCambioEnvio(p))
    .subscribe((estado) => $('#vivo').classList.toggle('off', estado !== 'SUBSCRIBED'));
}
function pararTiempoReal() { if (canal) { sb.removeChannel(canal); canal = null; } }
function alCambio(tabla, p) {
  if (tabla === 'informes' && p.eventType === 'INSERT') {
    aviso(`📝 Nuevo informe de ${nombreDe(p.new.operario_id)}`);
  } else if (tabla === 'asignaciones' && p.eventType === 'UPDATE' && p.old?.estado !== p.new?.estado && p.new?.estado) {
    if (p.new.estado === 'en_camino') aviso(`🚐 ${nombreDe(p.new.operario_id)} va en camino`);
    if (p.new.estado === 'no_realizado') aviso(`⚠️ ${nombreDe(p.new.operario_id)}: visita no realizada`);
  }
  if (tabla === 'informes') contarSinRevisar();
  // No recargar si hay una ventana abierta (para no perder lo que se está escribiendo)
  clearTimeout(recargaT);
  recargaT = setTimeout(() => { if (!$('#modal').innerHTML) irA(vistaActual, true); }, 600);
}
async function contarSinRevisar() {
  const { count } = await sb.from('informes').select('id', { count: 'exact', head: true }).eq('revisado', false);
  const b = $('#b-inf'); b.textContent = count || ''; b.classList.toggle('oculto', !count);
}

// ---------- SIGMA (robot que lee el portal cada 15 min) ----------
const CUENTAS_SIGMA = { VLL: 'Valladolid', PAL: 'Palencia' };
const codigo = (tipo, c) => (c ? cache.codigos[tipo + ':' + String(c).toUpperCase()] || cache.codigos[tipo + ':' + c] || '' : '');
async function cargarSigma() {
  const { data } = await sb.from('sigma_sincronizaciones').select('*').eq('prueba', false).order('inicio', { ascending: false }).limit(30);
  cache.sinc = data || [];
  pintarSigma();
}
function ultimaSigma() {
  const m = {};
  for (const s of cache.sinc) if (s.fin && !m[s.cuenta]) m[s.cuenta] = s;
  return m;
}
function pintarSigma() {
  const el = $('#sigma-ind'); if (!el) return;
  const ult = Object.values(ultimaSigma());
  if (!ult.length) { el.classList.add('oculto'); return; }
  const mal = ult.filter((s) => !s.ok);
  const ultima = ult.map((s) => s.fin).sort().pop();
  const masVieja = ult.map((s) => s.fin).sort()[0];
  const h = new Date().getHours();
  const viejo = h >= 8 && h < 22 && Date.now() - new Date(masVieja) > 45 * 60000;
  el.className = 'sigma-ind ' + (mal.length ? 'mal' : viejo ? 'viejo' : 'ok');
  el.textContent = mal.length ? `SIGMA ⚠️ ${mal.map((s) => CUENTAS_SIGMA[s.cuenta] || s.cuenta).join(', ')}` : `SIGMA ${hace(ultima)}`;
}
setInterval(pintarSigma, 60000);
function modalSigma() {
  const ult = ultimaSigma();
  const fila = (s) => `<tr><td>${fHora(s.inicio)}</td><td>${esc(CUENTAS_SIGMA[s.cuenta] || s.cuenta)}</td>
    <td>${s.fin ? (s.ok ? '<span class="et hecho">OK</span>' : '<span class="et no_realizado">Error</span>') : '<span class="et en_camino">En curso</span>'}</td>
    <td>${s.en_listado ?? ''}</td><td>${s.nuevos || ''}</td><td>${s.aceptados || ''}</td><td>${s.cambiados || ''}</td><td>${s.desaparecidos || ''}</td>
    <td style="color:var(--peligro)">${esc(s.error || '')}</td></tr>`;
  abrirModal(`
    <h3>Robot SIGMA</h3>
    <div style="color:var(--suave)">Lee el portal de SIGMA cada 15 minutos (7:00–21:45 en verano, 6:00–20:45 en invierno), da de alta los servicios nuevos, actualiza los cambios y <b>acepta automáticamente los servicios ofrecidos</b>. La oficina recibe un aviso de cada novedad.</div>
    <div class="kpis" style="margin-top:14px">${Object.keys(CUENTAS_SIGMA).map((c) => {
      const s = ult[c];
      return `<div class="kpi ${s && !s.ok ? 'mal' : ''}"><div class="n">${s ? s.en_listado ?? '—' : '—'}</div><div class="t">${CUENTAS_SIGMA[c]} · en curso</div>
        <div style="font-size:12px;color:var(--suave);margin-top:4px">${s ? (s.ok ? 'Leído ' + hace(s.fin) : '⚠️ ' + esc(s.error || 'Error')) : 'Sin datos todavía'}</div></div>`;
    }).join('')}</div>
    <div style="overflow-x:auto"><table class="lista" style="font-size:12px"><thead><tr><th>Hora</th><th>Cuenta</th><th>Resultado</th><th>En curso</th><th>Nuevos</th><th>Aceptados</th><th>Cambios</th><th>Ya no en curso</th><th>Error</th></tr></thead>
    <tbody>${cache.sinc.slice(0, 20).map(fila).join('') || '<tr><td colspan="9" class="vacio">Sin pasadas todavía.</td></tr>'}</tbody></table></div>
    <div class="acciones"><button onclick="cerrarModal()">Cerrar</button></div>`, true);
}
function etiquetaSigma(p) {
  if (!p.sigma_cuenta) return '';
  return `<span class="et sigma" title="SIGMA ${esc(CUENTAS_SIGMA[p.sigma_cuenta] || '')}">${p.sigma_alerta ? `<span class="punto ${p.sigma_alerta}"></span>` : ''}SIGMA ${p.sigma_cuenta === 'PAL' ? 'PA' : 'VA'}</span>`
    + (p.sigma_en_curso === false ? ' <span class="et anulado" title="Ya no aparece en Servicios en curso del portal">Fuera de SIGMA</span>' : '');
}
function bloqueSigma(p) {
  if (!p.sigma_cuenta) return '';
  const est = p.sigma_estado_texto || codigo('estado', p.sigma_estado) || p.sigma_estado || '—';
  const proc = codigo('procedencia', p.sigma_procedencia);
  const gre = codigo('gremio', p.sigma_gremio);
  const tels = p.sigma_telefonos || [];
  const bit = p.sigma_bitacora || [];
  const fichaOtros = p.sigma_ficha || {};
  const dato = (t, v) => (v || v === 0 ? `<div><span>${t}:</span> ${esc(v)}</div>` : '');
  return `<div class="sigma-caja">
    <div class="cab"><b>Datos de SIGMA · ${esc(CUENTAS_SIGMA[p.sigma_cuenta] || p.sigma_cuenta)}</b> ${etiquetaSigma(p)}
      ${(p.sigma_marcas || []).map((m) => `<span class="et ${/urgente|reclam/i.test(m) ? 'urg' : ''}">${esc(m)}</span>`).join(' ')}
      <span class="esp"></span>
      <a href="https://web.multiasistencia.com/w3multi/repasos1.php?reparacion=${encodeURIComponent(p.numero_servicio)}" target="_blank" rel="noopener" style="font-size:12px">Abrir en el portal ↗</a></div>
    <div class="sigma-datos">
      ${dato('Estado', est)}
      ${dato('Procedencia', proc ? proc.replace(/^Siniestros - /, '') : p.sigma_procedencia)}
      ${dato('Gremio SIGMA', [p.sigma_gremio, gre].filter(Boolean).join(' '))}
      ${dato('Caducidad (días)', p.sigma_caducidad)}
      ${dato('Llamadas', p.sigma_llamadas)}
      ${dato('Duración', p.sigma_duracion)}
      ${dato('Póliza', p.sigma_poliza)}

    </div>

    ${bit.length ? `<details ${bit.length <= 15 ? 'open' : ''}><summary>Bitácora del portal (${bit.length} anotaciones)</summary>
      <div class="bitacora">${bit.map((e) => `<div>${e.fecha ? `<b>${esc(fHora(e.fecha.replace(' ', 'T')))}</b> ` : ''}${esc(e.texto)}</div>`).join('')}</div></details>` : ''}
    <div style="font-size:11px;color:var(--suave);margin-top:8px">${p.sigma_ficha_en ? 'Ficha leída del portal ' + hace(p.sigma_ficha_en) : 'Ficha pendiente de leer (próxima pasada del robot)'} · estos datos los actualiza el robot y no se editan aquí.</div>
  </div>`;
}

// ---------- Envíos a SIGMA (bandeja con aprobación) ----------
// Nada sale al portal hasta que la oficina pulsa "Aprobar y enviar".
const MOTIVOS_REPASO = [
  ['1', 'Contacto con Cliente', 1], ['2', 'Visita al Cliente', 15], ['3', 'Entrega presupuesto', 99], ['4', 'Aplazamiento por material', 99],
  ['7', 'Aplazamiento pte. otra reparación MA', 30], ['8', 'Aplazamiento por Humedad', 30], ['9', 'Aplazamiento pte. mejora tiempo', 15],
  ['11', 'Aplazamiento pte. de cobro', 15], ['12', 'Aplazamiento pte. aceptar Presupuesto', 99], ['13', 'Fin previsto', 15],
  ['26', 'Cliente ilocalizable', 7], ['34', 'Servicio Rechazado', 0], ['37', 'Pendiente de instrucciones de cliente', 60],
  ['43', 'Visita aplazada por cliente', 99], ['74', 'Fecha de cierre', 20], ['80', 'Gestión irreparable', 0],
  ['82', 'Perjudicado ilocalizable', 99], ['83', 'Pendiente aprobación facturación', 3], ['86', 'Visita de instalación', 5],
  ['95', 'Reparación en observación', 15], ['99', 'Aplazamiento por búsqueda de material', 5], ['101', 'Intento contacto cliente', 1],
];
const RESOLUCIONES = {
  V: ['Visita realizada', [['609', 'Finalizado, no requiere nueva cita'], ['601', 'Reparado parcialmente, requiere nueva cita'], ['604', 'No reparado, requiere nueva cita'], ['611', 'No hay que reparar, no requiere nueva cita']]],
  I: ['Visita cancelada', [['706', 'Causa asegurado/perjudicado'], ['707', 'Causa profesional'], ['708', 'No hay que reparar, no requiere nueva cita']]],
  C: ['Cita cancelada', [['213', 'Causa asegurado/perjudicado'], ['214', 'Causa profesional'], ['212', 'Perito confirme coberturas'], ['215', 'No hay que reparar, no requiere nueva cita']]],
};
const TXT_ENVIO = { borrador: 'Por revisar', aprobado: 'Aprobado', enviando: 'Enviando…', enviado: 'Enviado', error: 'Error', descartado: 'Descartado' };
const HORAS_SIGMA = [...Array(28)].map((_, i) => `${dos(8 + Math.floor(i / 2))}:${i % 2 ? '30' : '00'}`);
const fDMA = (iso) => (iso ? iso.split('-').reverse().join('/') : '');
function tituloEnvio(e) {
  if (e.tipo === 'repaso') return `Repaso · ${e.motivo_texto || 'motivo'}${e.fecha ? ' · ' + fDMA(e.fecha) : ''}${e.hora ? ' ' + hCorta(e.hora) : ''}`;
  return `Informar cita · ${RESOLUCIONES[e.resolucion]?.[0] || ''}${e.cita_fecha ? ' · citada ' + fDMA(e.cita_fecha) : ''}${e.cita_hora ? ' ' + hCorta(e.cita_hora) : ''}`;
}
let filtroEnvios = 'revisar';
async function contarEnvios() {
  const { count } = await sb.from('sigma_envios').select('id', { count: 'exact', head: true }).in('estado', ['borrador', 'error']);
  const b = $('#b-env'); if (!b) return; b.textContent = count || ''; b.classList.toggle('oculto', !count);
}
function alCambioEnvio(p) {
  contarEnvios();
  if (p.eventType === 'UPDATE' && p.new?.estado !== p.old?.estado) {
    if (p.new.estado === 'enviado') aviso('✅ Enviado a SIGMA');
    if (p.new.estado === 'error') aviso('⚠️ Un envío a SIGMA ha fallado: revisa la bandeja');
  }
  if (vistaActual === 'envios' && !$('#modal').innerHTML) { clearTimeout(alCambioEnvio.t); alCambioEnvio.t = setTimeout(vistaEnvios, 400); }
}
async function vistaEnvios() {
  const grupos = { revisar: ['borrador', 'error'], cola: ['aprobado', 'enviando'], enviados: ['enviado'], descartados: ['descartado'] };
  const nombres = { revisar: 'Por revisar', cola: 'En cola', enviados: 'Enviados', descartados: 'Descartados' };
  $('#contenido').innerHTML = `
    <div class="barra"><h2>Envíos a SIGMA</h2>
      <div class="pest">${Object.keys(grupos).map((g) => `<button class="mini ${g === filtroEnvios ? 'activo' : ''}" onclick="filtroEnvios='${g}';vistaEnvios()">${nombres[g]}</button>`).join('')}</div>
      <span class="esp"></span>
      ${filtroEnvios === 'revisar' ? '<button class="sec" onclick="aprobarTodos()">Aprobar todos los correctos</button>' : ''}
    </div>
    <p style="color:var(--suave);margin-top:-6px">Se preparan solos al planificar visitas y al recibir informes. Revisa, corrige lo que quieras y pulsa <b>Aprobar y enviar</b>: el robot lo graba en el portal en ese momento. “Informar citas” usa siempre la fecha y hora citadas.</p>
    <div id="lista-envios">Cargando…</div>`;
  let q = sb.from('sigma_envios').select('*, parte:partes(id, numero_servicio, direccion, poblacion, sigma_cuenta, sigma_alerta)')
    .in('estado', grupos[filtroEnvios]).order('creado_en', { ascending: filtroEnvios === 'revisar' || filtroEnvios === 'cola' });
  if (filtroEnvios === 'enviados' || filtroEnvios === 'descartados') q = q.limit(60);
  const { data, error } = await q;
  if (error) return fallo(error);
  $('#lista-envios').innerHTML = (data || []).map((e) => {
    const problema = validarEnvio(e);
    return `<div class="tarjeta envio" onclick="modalEnvio('${e.id}')">
      <div class="d">
        <div class="t">${esc(e.parte?.numero_servicio)} ${etiquetaSigma(e.parte || {})} <span class="et ${e.estado}">${TXT_ENVIO[e.estado]}</span></div>
        <div>${esc(tituloEnvio(e))}</div>
        <div style="color:var(--suave);font-size:12px">${esc([e.parte?.direccion, e.parte?.poblacion].filter(Boolean).join(', '))} · ${hace(e.creado_en)}</div>
        <div class="c">${esc(e.comentario)}</div>
        ${e.resultado ? `<div class="r ${e.estado === 'enviado' ? 'ok' : 'mal'}">${esc(e.resultado)}</div>` : ''}
        ${problema && ['borrador', 'error'].includes(e.estado) ? `<div class="r mal">⚠️ ${esc(problema)}</div>` : ''}
      </div>
      ${['borrador', 'error'].includes(e.estado) ? `<div class="acc" onclick="event.stopPropagation()">
        <button class="mini" ${problema ? 'disabled' : ''} onclick="cambiarEnvio('${e.id}','aprobado')">${e.estado === 'error' ? 'Reintentar' : 'Aprobar y enviar'}</button>
        <button class="mini peligro" onclick="cambiarEnvio('${e.id}','descartado')">Descartar</button></div>` : ''}
    </div>`;
  }).join('') || '<div class="tarjeta vacio">No hay envíos aquí.</div>';
}
function validarEnvio(e) {
  if (!e.comentario || !e.comentario.trim()) return 'Falta el comentario';
  if (e.tipo === 'repaso') {
    const m = MOTIVOS_REPASO.find((x) => x[0] === String(e.motivo_codigo));
    if (!m) return 'Elige un motivo';
    if (!e.fecha) return 'Falta la fecha';
    const dias = Math.round((deISO(e.fecha) - deISO(hoyISO())) / 86400000);
    if (dias < 0) return 'La fecha ya ha pasado';
    if (dias > m[2]) return `Para "${m[1]}" la fecha no puede pasar de ${m[2]} días desde hoy`;
    if (e.hora && !HORAS_SIGMA.includes(hCorta(e.hora))) return 'La hora debe ser en punto o y media (08:00–21:30)';
  } else {
    if (!RESOLUCIONES[e.resolucion]) return 'Elige la resolución';
    if (!RESOLUCIONES[e.resolucion][1].some((x) => x[0] === e.resolucion_motivo)) return 'Elige el motivo';
  }
  return '';
}
async function cambiarEnvio(id, estado) {
  if (estado === 'descartado' && !confirm('¿Descartar este envío? No se mandará a SIGMA.')) return;
  const { error } = await sb.from('sigma_envios').update({ estado, ...(estado === 'aprobado' ? { resultado: null } : {}) }).eq('id', id);
  if (error) return fallo(error);
  aviso(estado === 'aprobado' ? 'Aprobado: enviándolo a SIGMA…' : 'Descartado');
  cerrarModal(); contarEnvios(); if (vistaActual === 'envios') vistaEnvios();
}
async function aprobarTodos() {
  const { data } = await sb.from('sigma_envios').select('*').in('estado', ['borrador']);
  const ok = (data || []).filter((e) => !validarEnvio(e));
  if (!ok.length) return alert('No hay borradores listos para aprobar (revisa los avisos ⚠️).');
  if (!confirm(`¿Aprobar y enviar ${ok.length} envío(s) a SIGMA?`)) return;
  for (const e of ok) { const { error } = await sb.from('sigma_envios').update({ estado: 'aprobado' }).eq('id', e.id); if (error) return fallo(error); }
  aviso(`${ok.length} envío(s) aprobados`); vistaEnvios(); contarEnvios();
}
async function nuevoEnvio(parteId) {
  const { data, error } = await sb.from('sigma_envios').insert({ parte_id: parteId, tipo: 'repaso', origen: 'manual', motivo_codigo: '2', motivo_texto: 'Visita al Cliente', comentario: '' }).select('id').single();
  if (error) return fallo(error);
  modalEnvio(data.id);
}
async function modalEnvio(id) {
  const { data: e, error } = await sb.from('sigma_envios').select('*, parte:partes(id, numero_servicio, direccion, poblacion, sigma_cuenta, sigma_alerta, sigma_estado_texto)').eq('id', id).single();
  if (error) return fallo(error);
  const editable = ['borrador', 'error'].includes(e.estado);
  const dis = editable ? '' : 'disabled';
  const cab = `<h3>${e.tipo === 'repaso' ? 'Repaso' : 'Informar citas'} · ${esc(e.parte.numero_servicio)} <span class="et ${e.estado}">${TXT_ENVIO[e.estado]}</span></h3>
    <div style="color:var(--suave)">${esc([e.parte.direccion, e.parte.poblacion].filter(Boolean).join(', '))} ${etiquetaSigma(e.parte)}</div>
    ${e.parte.sigma_estado_texto ? `<div style="font-size:12px;color:var(--suave);margin-top:4px">Estado actual en SIGMA: ${esc(e.parte.sigma_estado_texto)}</div>` : ''}
    ${e.resultado ? `<div class="nota" style="margin-top:10px;${e.estado === 'enviado' ? 'background:#DDF0E3;color:var(--ok)' : ''}">${esc(e.resultado)}</div>` : ''}`;
  let campos;
  if (e.tipo === 'repaso') {
    const horaActual = hCorta(e.hora);
    campos = `
      <label>Motivo</label><select id="en-motivo" ${dis}>${MOTIVOS_REPASO.map((m) => `<option value="${m[0]}" ${String(e.motivo_codigo) === m[0] ? 'selected' : ''}>${esc(m[1])} [${m[2]} días]</option>`).join('')}</select>
      <div class="dos">
        <div><label>Fecha siguiente acción</label><input id="en-fecha" type="date" value="${e.fecha || ''}" ${dis}></div>
        <div><label>Hora</label><select id="en-hora" ${dis}><option value="">Sin hora</option>${HORAS_SIGMA.map((h) => `<option ${h === horaActual ? 'selected' : ''}>${h}</option>`).join('')}${horaActual && !HORAS_SIGMA.includes(horaActual) ? `<option selected value="${horaActual}">${horaActual} (no válida en SIGMA)</option>` : ''}</select></div>
      </div>`;
  } else {
    campos = `
      <div class="dos">
        <div><label>Resolución</label><select id="en-res" ${dis} onchange="rellenarMotivosCita()">${Object.entries(RESOLUCIONES).map(([k, v]) => `<option value="${k}" ${e.resolucion === k ? 'selected' : ''}>${v[0]}</option>`).join('')}</select></div>
        <div><label>Motivo</label><select id="en-resmot" ${dis} data-actual="${esc(e.resolucion_motivo || '')}"></select></div>
      </div>
      <div class="nota" style="margin-top:10px">Se informará con la <b>fecha y hora citadas</b>${e.cita_fecha ? `: ${fDMA(e.cita_fecha)}${e.cita_hora ? ' a las ' + hCorta(e.cita_hora) : ''}` : ''} (las que figuran en el portal), nunca con la hora del informe.</div>`;
  }
  abrirModal(`${cab}${campos}
    <label>Comentario (es lo que verá SIGMA)</label><textarea id="en-com" ${dis} style="min-height:120px">${esc(e.comentario || '')}</textarea>
    <div class="acciones">
      ${editable ? `<button class="peligro" onclick="cambiarEnvio('${e.id}','descartado')">Descartar</button>` : ''}
      <span class="esp"></span>
      <button class="sec" onclick="cerrarModal();modalParte('${e.parte.id}')">Ver parte</button>
      ${editable ? `<button class="sec" onclick="guardarEnvio('${e.id}',false)">Guardar</button><button onclick="guardarEnvio('${e.id}',true)">${e.estado === 'error' ? 'Guardar y reintentar' : 'Aprobar y enviar'}</button>` : '<button onclick="cerrarModal()">Cerrar</button>'}
    </div>`, true);
  if (e.tipo !== 'repaso') rellenarMotivosCita();
}
function rellenarMotivosCita() {
  const s = $('#en-resmot'); if (!s) return;
  const lista = RESOLUCIONES[$('#en-res').value][1];
  const actual = s.dataset.actual;
  s.innerHTML = lista.map((m) => `<option value="${m[0]}" ${m[0] === actual ? 'selected' : ''}>${esc(m[1])}</option>`).join('');
}
async function guardarEnvio(id, aprobar) {
  const { data: e } = await sb.from('sigma_envios').select('tipo').eq('id', id).single();
  const fila = { comentario: $('#en-com').value.trim() };
  if (e.tipo === 'repaso') {
    const m = MOTIVOS_REPASO.find((x) => x[0] === $('#en-motivo').value);
    Object.assign(fila, { motivo_codigo: m[0], motivo_texto: m[1], fecha: $('#en-fecha').value || null, hora: $('#en-hora').value || null });
  } else {
    const r = $('#en-res').value; const mm = $('#en-resmot').value;
    Object.assign(fila, { resolucion: r, resolucion_motivo: mm, motivo_texto: RESOLUCIONES[r][1].find((x) => x[0] === mm)?.[1] });
  }
  const problema = validarEnvio({ ...e, ...fila });
  if (aprobar && problema) return alert('No se puede enviar: ' + problema);
  if (aprobar) { fila.estado = 'aprobado'; fila.resultado = null; }
  else if (problema) aviso('Guardado (ojo: ' + problema + ')');
  const { error } = await sb.from('sigma_envios').update(fila).eq('id', id);
  if (error) return fallo(error);
  if (aprobar) aviso('Aprobado: enviándolo a SIGMA…'); else if (!problema) aviso('Guardado');
  cerrarModal(); contarEnvios(); if (vistaActual === 'envios') vistaEnvios();
}

}

    <a class="kpi" href="#plan"><div class="n">${hechas}/${lista.length}</div><div class="t">Visitas hechas hoy</div></a>
    <a class="kpi ${noReal ? 'mal' : ''}" href="#plan"><div class="n">${noReal}</div><div class="t">No realizadas hoy</div></a>
    <a class="kpi ${urg.count ? 'mal' : ''}" href="#partes"><div class="n">${urg.count ?? 0}</div><div class="t">Urgentes abiertos</div></a>

  lista.forEach((a) => (porOp[a.operario_id] ??= []).push(a));
  const ids = [...new Set([...cache.operarios.map((o) => o.id), ...Object.keys(porOp)])];
  $('#rutas-hoy').innerHTML = ids.length ? ids.map((id) => {

    const h = v.filter((a) => a.estado === 'hecho' || a.estado === 'no_realizado').length;
    const enCamino = v.find((a) => a.estado === 'en_camino');
    return `<div class="tarjeta op-hoy">
      <div class="cab"><b>${esc(nombreDe(id))}</b>${enCamino ? `<span class="et en_camino">En camino → ${esc(enCamino.parte?.numero_servicio)}</span>` : ''}
        <span class="esp"></span><span style="color:var(--suave)">${h}/${v.length}</span>
        ${v.length ? `<button class="mini sec" onclick='verRuta(${JSON.stringify(v.map((a) => dirCompleta(a.parte)))})'>Mapa</button>` : ''}</div>

      ${v.map((a) => `<div class="visita" onclick="modalAsignacion('${a.id}')">

          <span class="et ${a.estado}">${TXT_ESTADO[a.estado]}</span></div>`).join('') || '<div style="color:var(--suave)">Sin visitas hoy.</div>'}
    </div>`;
  }).join('') : '<div class="tarjeta vacio">No hay operarios. Créalos en la pestaña Operarios.</div>';

  const u = ultimos.data || [];

    <div class="item" onclick="filtroInformes={parte:'${i.parte?.id}'};location.hash='informes'">
      <div><b>${esc(i.parte?.numero_servicio)}</b> · ${esc(nombreDe(i.operario_id))} <span style="color:var(--suave)">· ${hace(i.creado_en)}</span>
        ${i.revisado ? '' : '<span class="et nuevo">Nuevo</span>'} ${i.necesita_repaso ? '<span class="et pendiente">Repaso</span>' : ''}</div>
      <div class="txt">${esc(i.texto)}</div></div>`).join('') : '<div class="vacio">Todavía no hay informes.</div>';
}

function verRuta(dirs) {
  if (!dirs.length) return;
  const l = dirs.slice(0, 10);
  let url = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(l[l.length - 1])}&travelmode=driving`;
  if (l.length > 1) url += `&waypoints=${encodeURIComponent(l.slice(0, -1).join('|'))}`;
  window.open(url, '_blank', 'noopener');
}

async function soltar(ev, td) {
  ev.preventDefault(); td.classList.remove('sobre');
  if (!arrastrando) return;
  const operario_id = td.dataset.op, fecha = td.dataset.f;
  const orden = td.querySelectorAll('.chip').length + 1;
  const a = arrastrando; arrastrando = null;
  const r = a.tipo === 'parte'
    ? await sb.from('asignaciones').insert({ parte_id: a.id, operario_id, fecha, orden })
    : await sb.from('asignaciones').update({ operario_id, fecha, orden }).eq('id', a.id);
  if (r.error) return fallo(r.error);
  aviso(a.tipo === 'parte' ? 'Parte asignado' : 'Visita movida');
  vistaPlan();
}

async function guardarAsignacion(id) {
  const { error } = await sb.from('asignaciones').update({
    operario_id: val('ae-op'), fecha: val('ae-fecha'), hora: val('ae-hora') || null,
    orden: Number(val('ae-orden') || 0), tipo: val('ae-tipo'), estado: val('ae-estado'), notas: val('ae-notas') || null,
  }).eq('id', id);
  if (error) return fallo(error);

async function quitarAsignacion(id) {
  if (!confirm('¿Quitar esta visita de la planificación? (El parte no se borra)')) return;
  const { data: a } = await sb.from('asignaciones').select('parte_id').eq('id', id).single();
  // Si la visita tiene informes, borrarla los borraría también: no se permite.
  const { count: nInf } = await sb.from('informes').select('id', { count: 'exact', head: true }).eq('asignacion_id', id);
  if (nInf) return alert('Esta visita ya tiene informes del operario y no se puede quitar (se perderían). Cambia su estado o su fecha en su lugar.');
  const { error } = await sb.from('asignaciones').delete().eq('id', id);
  if (error) return fallo(error);
  const { count } = await sb.from('asignaciones').select('id', { count: 'exact', head: true }).eq('parte_id', a.parte_id);
  if (count === 0) await sb.from('partes').update({ estado: 'pendiente' }).eq('id', a.parte_id).eq('estado', 'asignado');
  cerrarModal(); aviso('Visita quitada'); irA(vistaActual);
}

let ultimosPartes = [];
async function consultaPartes(limite) {
  let q = sb.from('partes').select('*, compania:companias(nombre), asignaciones!asignaciones_parte_id_fkey(fecha, operario_id)')
    .order('urgente', { ascending: false }).order('creado_en', { ascending: false }).limit(limite);
  if (filtroPartes.estado === 'abiertos') q = q.in('estado', ['pendiente', 'asignado', 'en_curso', 'terminado']);
  else if (filtroPartes.estado !== 'todos') q = q.eq('estado', filtroPartes.estado);
  if (filtroPartes.cia) q = q.eq('compania_id', Number(filtroPartes.cia));
  if (filtroPartes.sigma === 'VLL' || filtroPartes.sigma === 'PAL') q = q.eq('sigma_cuenta', filtroPartes.sigma);
  else if (filtroPartes.sigma === 'rojo') q = q.eq('sigma_alerta', 'rojo').eq('sigma_en_curso', true);
  else if (filtroPartes.sigma === 'fuera') q = q.eq('sigma_en_curso', false);
  if (filtroPartes.texto) {
    const t = filtroPartes.texto.replace(/[,()%*]/g, ' ');
    q = q.or(`numero_servicio.ilike.%${t}%,direccion.ilike.%${t}%,asegurado.ilike.%${t}%,poblacion.ilike.%${t}%,telefono.ilike.%${t}%`);
  }
  return q;
}
async function cargarPartes() {

  ultimosPartes = data;
  const hoy = hoyISO();
  $('#tabla-partes').innerHTML = data.length ? `
    <div style="overflow-x:auto"><table class="lista"><thead><tr><th>Nº servicio</th><th class="opc">Compañía</th><th>Dirección</th><th class="opc">Cliente</th><th class="opc">Gremio</th><th>Estado</th><th>Próxima visita</th></tr></thead>
    <tbody>${data.map((p) => {

        <td>${prox ? fCorta(prox.fecha) + '<br><small style="color:var(--suave)">' + esc(nombreDe(prox.operario_id)) + '</small>' : '—'}</td>
      </tr>`;
    }).join('')}</tbody></table></div>
    <p style="color:var(--suave);font-size:12px">${data.length} parte(s)${data.length === 300 ? ' (máximo 300; afina la búsqueda)' : ''}</p>` : '<div class="tarjeta vacio">No hay partes con ese filtro.</div>';
}
function exportarPartes() {
  const cols = ['compania', 'numero_servicio', 'estado', 'urgente', 'gremio', 'asegurado', 'telefono', 'telefono2', 'direccion', 'codigo_postal', 'poblacion', 'descripcion', 'creado_en'];
  const csvCelda = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const filas = ultimosPartes.map((p) => cols.map((c) => csvCelda(c === 'compania' ? p.compania?.nombre : c === 'estado' ? TXT_ESTADO[p.estado] : c === 'urgente' ? (p.urgente ? 'Sí' : 'No') : p[c])).join(';'));
  const blob = new Blob(['﻿' + [cols.join(';'), ...filas].join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `partes-kubel-${hoyISO()}.csv`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

    gremio: val('pt-gremio') || null, telefono: val('pt-tel') || null, telefono2: val('pt-tel2') || null,

    aseguradora: val('pt-aseguradora') || null, poliza: val('pt-poliza') || null,
    urgente: $('#pt-urg').checked, estado: val('pt-estado'),
  };
  if (!fila.numero_servicio || !fila.direccion) return alert('El nº de servicio y la dirección son obligatorios.');

async function marcarRevisado(id) {

function abrirVisor(n) {
  idxVisor = n; const f = fotosVisor[n]; if (!f?.url) return;
  $('#visor').innerHTML = `<div class="visor" onclick="if(event.target===this)cerrarVisor()">
    <img src="${f.url}" alt="">
    <div class="barra-v">
      <button onclick="abrirVisor((idxVisor-1+fotosVisor.length)%fotosVisor.length)">‹</button>
      <span>${esc(f.parte)} · ${f.tipo === 'despues' ? 'después' : f.tipo} · ${n + 1}/${fotosVisor.length}</span>
      <button onclick="abrirVisor((idxVisor+1)%fotosVisor.length)">›</button>
      <button onclick="window.open(fotosVisor[idxVisor].url,'_blank')">Abrir / descargar</button>
      <button onclick="cerrarVisor()">✕</button>
    </div></div>`;
}
function cerrarVisor() { $('#visor').innerHTML = ''; }
document.addEventListener('keydown', (e) => {
  if (!$('#visor').innerHTML) return;
  if (e.key === 'ArrowRight') abrirVisor((idxVisor + 1) % fotosVisor.length);
  if (e.key === 'ArrowLeft') abrirVisor((idxVisor - 1 + fotosVisor.length) % fotosVisor.length);
});

  } catch (e) { cache.todosPerfiles.forEach((p) => { const td = $('#op-e-' + p.id); if (td) td.textContent = '—'; }); }
}
// ---------- Copias de seguridad ----------
const b64aBytes = (b) => Uint8Array.from(atob(b), (c) => c.charCodeAt(0));
async function descifrarCopia(c) {
  if (c?.formato !== 'kubel-copia-v1') throw new Error('Este archivo no es una copia de KUBEL.');
  const { data: clave, error } = await sb.rpc('clave_copias');
  if (error) throw error;
  const key = await crypto.subtle.importKey('raw', b64aBytes(clave), 'AES-GCM', false, ['decrypt']);
  const plano = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64aBytes(c.iv) }, key, b64aBytes(c.datos));
  return JSON.parse(new TextDecoder().decode(plano));
}
function descargarJSON(obj, nombre) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' }));
  a.download = nombre; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
const resumenCopia = (d) => Object.entries(d.datos).map(([t, f]) => `${t}: ${f.length}`).join(' · ');
async function copiaAhora() {
  $('#btn-copia').disabled = true; $('#copia-res').textContent = 'Preparando copia…';
  try {
    const { data, error } = await sb.functions.invoke('copia', { body: {} });
    if (error) throw error;
    const d = await descifrarCopia(data);
    descargarJSON(d, `kubel-copia-${hoyISO()}.json`);
    $('#copia-res').textContent = '✅ Copia descargada (' + resumenCopia(d) + ')';
  } catch (e) { $('#copia-res').textContent = 'Error: ' + mensaje(e); }
  $('#btn-copia').disabled = false;
}
async function abrirCopia(inp) {
  const f = inp.files?.[0]; inp.value = ''; if (!f) return;
  $('#copia-res').textContent = 'Abriendo…';
  try {
    if (/\.zip$/i.test(f.name)) throw new Error('GitHub la descarga comprimida: haz clic derecho en el .zip → "Extraer todo" y abre el .json de dentro.');
    const d = await descifrarCopia(JSON.parse(await f.text()));
    descargarJSON(d, f.name.replace(/\.json$/i, '') + '-abierta.json');
    $('#copia-res').textContent = `✅ Copia del ${fHora(d.fecha)} abierta y descargada (${resumenCopia(d)})`;
  } catch (e) { $('#copia-res').textContent = 'Error: ' + mensaje(e); }
}

function copiarEnlace() {
  navigator.clipboard?.writeText($('#enlace-op').textContent).then(() => aviso('Enlace copiado'), () => {});
}
async function guardarOperario(id) {
  const fila = {
    nombre: $('#op-n-' + id).value.trim(), telefono: $('#op-t-' + id).value.trim() || null,
    gremios: $('#op-g-' + id).value.split(',').map((x) => x.trim()).filter(Boolean),
  };
  if (id !== yo.id) { fila.rol = $('#op-r-' + id).value; fila.activo = $('#op-a-' + id).checked; }
  if (!fila.nombre) return alert('El nombre no puede quedar vacío.');
  const { error } = await sb.from('perfiles').update(fila).eq('id', id);
  if (error) return fallo(error);
  await cargarCatalogos(); aviso('Guardado');
}
function claveAleatoria() {
  const c = 'abcdefghjkmnpqrstuvwxyz23456789'; let s = '';
  const r = crypto.getRandomValues(new Uint32Array(8)); r.forEach((n) => (s += c[n % c.length])); return s;
}
