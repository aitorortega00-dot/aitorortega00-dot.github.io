<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KUBEL Oficina</title>
<meta name="theme-color" content="#1F4E5F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="iconos/favicon.png">
<link rel="apple-touch-icon" href="iconos/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KUBEL Oficina">
<script src="../comun/config.js"></script>
<script src="../comun/cargar-supabase.js"></script>
<script src="../comun/avisos.js"></script>
<script src="../comun/acceso.js"></script>
<style>
  :root{
    --fondo:#F3F1EC; --tarjeta:#fff; --texto:#1E2328; --suave:#5F6770; --borde:#E2DED6;
    --marca:#1F4E5F; --marca-suave:#E3ECEF; --acento:#E07A1F; --peligro:#C0392B; --ok:#2E7D4F; --azul:#1B5A8C;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--fondo);color:var(--texto)}
  a{color:var(--marca)}
  button,input,select,textarea{font:inherit}
  button{cursor:pointer;border-radius:8px;border:1.5px solid var(--marca);background:var(--marca);color:#fff;padding:7px 14px;font-weight:600}
  button.sec{background:#fff;color:var(--marca)}
  button.acento{background:var(--acento);border-color:var(--acento)}
  button.peligro{background:#fff;color:var(--peligro);border-color:var(--peligro)}
  button.mini{padding:3px 9px;font-size:12px}
  button:disabled{opacity:.5;cursor:default}
  a.boton-enlace{display:inline-block;border-radius:8px;border:1.5px solid var(--marca);background:#fff;color:var(--marca);padding:7px 14px;font-weight:600;text-decoration:none}
  a.boton-enlace.mini{padding:3px 9px;font-size:12px}
  select:disabled{background:#ECEAE4;color:#9AA0A6;cursor:not-allowed}
  input,select,textarea{border:1px solid var(--borde);border-radius:8px;padding:7px 10px;background:#FAFAF8;color:var(--texto);width:100%}
  textarea{min-height:80px;resize:vertical}
  label{display:block;font-weight:600;font-size:12px;color:var(--suave);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.4px}
  .oculto{display:none!important}

  header{background:var(--marca);color:#fff;display:flex;align-items:center;gap:20px;padding:0 20px;padding-top:env(safe-area-inset-top);min-height:56px;position:sticky;top:0;z-index:5}
  header .logo{font-weight:800;letter-spacing:3px;font-size:18px;white-space:nowrap}
  header .logo small{font-weight:600;letter-spacing:1px;font-size:11px;color:#C9DCE2;margin-left:6px}
  header nav{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none}
  header nav::-webkit-scrollbar{display:none}
  header nav a{color:#C9DCE2;text-decoration:none;padding:8px 12px;border-radius:8px;font-weight:600;white-space:nowrap;position:relative}
  header nav a.activo,header nav a:hover{background:rgba(255,255,255,.12);color:#fff}
  .badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--acento);color:#fff;font-size:11px;line-height:18px;text-align:center;margin-left:4px}
  header .usuario{font-size:13px;color:#C9DCE2;white-space:nowrap;display:flex;align-items:center;gap:8px}
  header .usuario button{background:transparent;border-color:#C9DCE2;color:#fff}
  .vivo{width:8px;height:8px;border-radius:50%;background:#7FD19B;display:inline-block}
  .vivo.off{background:#E8A598}

  main{padding:20px;max-width:1500px;margin:0 auto}
  .barra{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
  .barra h2{margin:0 12px 0 0;font-size:20px}
  .barra .esp{flex:1}
  .tarjeta{background:var(--tarjeta);border:1px solid var(--borde);border-radius:12px;padding:16px}

  .centro{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--marca);padding:20px}
  .caja{background:#fff;border-radius:16px;padding:28px;width:100%;max-width:400px}
  .caja h1{margin:0;color:var(--marca);letter-spacing:4px;text-align:center}
  .caja p{color:var(--suave);text-align:center;margin:4px 0 12px}
  .caja button{width:100%;margin-top:18px;padding:11px}
  .error{color:var(--peligro);margin-top:10px;font-size:13px}
  .nota{background:#FFF4E5;color:#8A4B00;border-radius:8px;padding:10px;font-size:13px}

  /* Hoy */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
  .kpi{background:#fff;border:1px solid var(--borde);border-radius:12px;padding:14px 16px;text-decoration:none;color:inherit;display:block}
  .kpi:hover{border-color:var(--marca)}
  .kpi .n{font-size:30px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
  .kpi .t{font-size:12px;color:var(--suave);text-transform:uppercase;letter-spacing:.4px;font-weight:600}
  .kpi.alerta .n{color:var(--acento)}
  .kpi.mal .n{color:var(--peligro)}
  .clasif{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .clasif button{background:#fff;color:inherit;border:1px solid var(--borde);font-weight:600}
  .clasif button.activo{border-color:var(--marca);box-shadow:inset 0 0 0 1px var(--marca)}
  .clasif button .badge{margin-left:6px}
  .hoy-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;align-items:start}
  .op-hoy{margin-bottom:12px}
  .op-hoy .cab{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .op-hoy .cab b{font-size:15px}
  .op-hoy .cab .esp{flex:1}
  .progreso{height:6px;background:#ECEAE4;border-radius:3px;overflow:hidden;margin-bottom:10px}
  .progreso div{height:100%;background:var(--ok)}
  .visita{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--borde);cursor:pointer}
  .visita:hover{background:#FAF8F3}
  .visita .h{width:44px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--suave)}
  .visita .d{flex:1;min-width:0}
  .visita .d div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .feed .item{padding:10px 0;border-top:1px solid var(--borde);cursor:pointer}
  .feed .item:first-of-type{border-top:0}
  .feed .item:hover{background:#FAF8F3}
  .feed .item .txt{color:var(--suave);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

  /* Planificación */
  .plan{display:grid;grid-template-columns:260px 1fr;gap:16px;align-items:start}
  .sin-plan{position:sticky;top:76px;max-height:calc(100vh - 96px);overflow:auto}
  .sin-plan h3{margin:0 0 8px;font-size:14px}
  .rejilla{overflow:auto;background:#fff;border:1px solid var(--borde);border-radius:12px}
  .rejilla table{border-collapse:collapse;width:100%;min-width:900px;table-layout:fixed}
  .rejilla th,.rejilla td{border-bottom:1px solid var(--borde);border-right:1px solid var(--borde);vertical-align:top;padding:6px}
  .rejilla th{background:#FAFAF8;font-size:12px;text-transform:capitalize;color:var(--suave);position:sticky;top:0}
  .rejilla th.hoy{background:var(--marca-suave);color:var(--marca)}
  .rejilla td.op{font-weight:700;width:130px;background:#FAFAF8}
  .rejilla td.celda{height:90px}
  .rejilla td.celda.sobre{background:#FFF4E5}
  .rejilla td.hoy{background:#F7FAFB}
  .chip{background:var(--marca-suave);border-left:4px solid var(--marca);border-radius:6px;padding:4px 6px;margin-bottom:5px;font-size:12px;cursor:grab;line-height:1.3}
  .chip b{display:block}
  .chip .dir{color:var(--suave);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chip.urgente{border-left-color:var(--peligro)}
  .chip.hecho{opacity:.55;border-left-color:var(--ok)}
  .chip.no_realizado{border-left-color:var(--peligro);background:#F8DEDA}
  .anadir{display:block;width:100%;background:transparent;border:1px dashed var(--borde);color:var(--suave);padding:2px;font-weight:400;font-size:12px}
  .anadir:hover{border-color:var(--marca);color:var(--marca)}
  .leyenda{display:flex;gap:14px;font-size:12px;color:var(--suave);margin-top:10px;flex-wrap:wrap}
  .leyenda span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;background:var(--c)}

  table.lista{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--borde);border-radius:12px;overflow:hidden}
  table.lista th,table.lista td{padding:9px 10px;border-bottom:1px solid var(--borde);text-align:left;vertical-align:top}
  table.lista th{background:#FAFAF8;font-size:12px;color:var(--suave);text-transform:uppercase}
  table.lista tr.clic:hover{background:#FAF8F3;cursor:pointer}
  table.lista tr.nuevo-hoy td{background:#FFF6E5}
  table.lista tr.nuevo-hoy td:first-child{box-shadow:inset 4px 0 0 var(--acento)}
  table.lista tr.nuevo-hoy:hover td{background:#FDEFD3}
  .et{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;background:#ECEAE4;color:#4A5058;white-space:nowrap}
  .et.pendiente{background:#FDEBD8;color:#9A4E0B}
  .et.asignado{background:var(--marca-suave);color:var(--marca)}
  .et.en_curso,.et.en_camino{background:#DCEBF7;color:var(--azul)}
  .et.terminado,.et.hecho,.et.revisado{background:#DDF0E3;color:var(--ok)}
  .et.anulado,.et.no_realizado,.et.urg{background:#F8DEDA;color:#A33224}
  .et.nuevo{background:var(--acento);color:#fff}

  .informe{margin-bottom:12px}
  .informe.sin-revisar{border-left:4px solid var(--acento)}
  .informe .cab{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
  .informe .cab b{font-size:15px}
  .informe .cab .esp{flex:1}
  .informe .txt{white-space:pre-wrap}
  .fotos{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .fotos a{position:relative;display:block}
  .fotos img{width:110px;height:110px;object-fit:cover;border-radius:8px;border:1px solid var(--borde);background:var(--borde)}
  .fi-lista{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
  .fi-lista .fi{position:relative}
  .fi-lista img{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--borde);background:var(--borde);display:block;cursor:pointer}
  .fi-lista .fi button{position:absolute;top:3px;right:3px;padding:0 6px;font-size:12px;line-height:20px;border-radius:10px;background:rgba(0,0,0,.65);color:#fff;border:0}
  .fi-lista .fi.nueva img{outline:2px dashed var(--acento,#2563eb);outline-offset:-2px}
  .fotos span{position:absolute;left:4px;bottom:4px;background:rgba(0,0,0,.65);color:#fff;font-size:10px;padding:1px 5px;border-radius:4px;text-transform:uppercase}

  .velo{position:fixed;inset:0;background:rgba(20,25,30,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:20}
  .modal{background:#fff;border-radius:14px;width:100%;max-width:640px;padding:22px}
  .modal.ancho{max-width:860px}
  .modal{position:relative}
  .cerrar-x{position:absolute;top:10px;right:10px;width:32px;height:32px;padding:0;border:0;border-radius:8px;background:transparent;color:var(--suave);font-size:18px;line-height:32px;cursor:pointer}
  .cerrar-x:hover{background:#EFECE6;color:var(--texto)}
  .modal h3{padding-right:36px}
  .modal h3{margin:0 0 6px}
  .modal .acciones{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
  .modal .acciones .esp{flex:1}
  .dos{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
  .tres{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 12px}
  .check{display:flex;gap:8px;align-items:center;margin-top:12px}
  .check input{width:auto}
  .aviso{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--texto);color:#fff;padding:10px 18px;border-radius:10px;z-index:30;font-weight:600;max-width:calc(100vw - 32px)}
  .vacio{color:var(--suave);padding:20px;text-align:center}

  .visor{position:fixed;inset:0;background:rgba(10,12,14,.92);z-index:40;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:16px}
  .visor img{max-width:100%;max-height:calc(100vh - 110px);border-radius:6px}
  .visor .barra-v{display:flex;gap:10px;align-items:center;color:#fff}
  .visor button{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3)}

  /* SIGMA */
  .sigma-ind{font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;cursor:pointer;white-space:nowrap;background:rgba(255,255,255,.12);color:#fff}
  .sigma-ind.ok::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#7FD19B;margin-right:6px;vertical-align:1px}
  .sigma-ind.viejo::before,.sigma-ind.mal::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#F2C14E;margin-right:6px;vertical-align:1px}
  .sigma-ind.mal{background:#C0392B}
  .et.sigma{background:#E7E3F4;color:#4B3B8F}
  .punto{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:0}
  .punto.rojo{background:#D9534F}.punto.amarillo{background:#E6B325}.punto.verde{background:#4CAF6E}
  .sigma-caja{background:#F7F5FC;border:1px solid #E1DCF0;border-radius:10px;padding:12px 14px;margin:12px 0 4px}
  .sigma-caja .cab{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
  .sigma-caja .cab .esp{flex:1}
  .sigma-datos{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:4px 14px;font-size:13px}
  .sigma-datos span{color:var(--suave)}
  .tels{margin-top:8px;font-size:13px}
  .tels a{font-weight:700;text-decoration:none}
  .bitacora{max-height:260px;overflow:auto;background:#fff;border:1px solid var(--borde);border-radius:8px;padding:4px 10px;margin-top:6px;font-size:13px}
  .bitacora div{padding:6px 0;border-top:1px solid var(--borde);white-space:pre-wrap}
  .bitacora div:first-child{border-top:0}
  .bitacora b{color:#4B3B8F;font-variant-numeric:tabular-nums}
  details summary{cursor:pointer;font-weight:600;font-size:13px;margin-top:10px}
  .envio{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px;cursor:pointer}
  .envio:hover{border-color:var(--marca)}
  .envio .d{flex:1;min-width:0}
  .envio .t{font-weight:700}
  .envio .c{color:var(--suave);white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .envio .r{font-size:12px;margin-top:4px}
  .envio .r.ok{color:var(--ok)}.envio .r.mal{color:var(--peligro)}
  .envio .acc{display:flex;flex-direction:column;gap:6px}
  .pest{display:flex;gap:6px;flex-wrap:wrap}
  .pest button{background:#fff;color:var(--marca)}
  .pest button.activo{background:var(--marca);color:#fff}
  .et.borrador{background:#FDEBD8;color:#9A4E0B}.et.aprobado,.et.enviando{background:#DCEBF7;color:var(--azul)}
  .et.enviado{background:#DDF0E3;color:var(--ok)}.et.error{background:#F8DEDA;color:#A33224}.et.descartado{background:#ECEAE4;color:#6B7178}

  /* Repasos · Caducadas: grupos arriba y carriles de estado (izquierda → derecha) */
  .cad-grupos{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:14px}
  .cad-g{--c:var(--marca);background:#fff;border:1px solid var(--borde);border-top:4px solid var(--c);border-radius:12px;padding:12px 14px;text-align:left;color:inherit;font-weight:400;display:block;width:100%}
  .cad-g:hover{border-color:var(--c)}
  .cad-g.activo{box-shadow:inset 0 0 0 2px var(--c);border-color:var(--c)}
  .cad-g .t{font-size:12px;font-weight:800;letter-spacing:.6px;color:var(--c);text-transform:uppercase}
  .cad-g .n{font-size:30px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
  .cad-g .n small{font-size:13px;font-weight:600;color:var(--suave);margin-left:4px}
  .cad-g .s{font-size:12px;color:var(--suave);margin-top:2px}
  .cad-g .progreso{margin:8px 0 0}
  .g-redes{--c:#1B5A8C}.g-resto{--c:#8A5A00}.g-cliente{--c:#6B3FA0}.g-todas{--c:var(--marca)}
  .et.gr{background:color-mix(in srgb,var(--c) 12%,#fff);color:var(--c)}
  .carriles{display:grid;grid-template-columns:repeat(4,minmax(230px,1fr));gap:12px;align-items:start;overflow-x:auto;padding-bottom:4px}
  .carril{--c:var(--suave);background:#ECEAE4;border-radius:12px;padding:8px;min-width:0}
  .carril>h3{margin:2px 4px 8px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--c);display:flex;align-items:center;gap:6px}
  .carril>h3::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c)}
  .carril>h3 .n{margin-left:auto;background:#fff;color:var(--texto);border-radius:9px;padding:0 8px;font-size:12px}
  .carril>p{margin:-4px 4px 8px;font-size:11px;color:var(--suave)}
  .c-caducada{--c:var(--peligro)}.c-bandeja{--c:#B8660B}.c-enviada{--c:var(--azul)}.c-resuelta{--c:var(--ok)}
  .cad{background:#fff;border:1px solid var(--borde);border-left:4px solid var(--c,var(--borde));border-radius:9px;padding:9px 10px;margin-bottom:8px;cursor:pointer;font-size:13px}
  .cad:hover{border-color:var(--c)}
  .cad .l1{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .cad .l1 b{font-size:14px;font-variant-numeric:tabular-nums}
  .cad .l1 .esp{flex:1}
  .cad .est{margin-top:4px;font-weight:600}
  .cad .met{color:var(--suave);font-size:12px}
  .cad .pie{display:flex;align-items:center;gap:6px;margin-top:7px;flex-wrap:wrap}
  .cad .pie .esp{flex:1}
  .cambio{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:5px;font-size:12px}
  .cambio .de{background:#F8DEDA;color:#A33224;border-radius:6px;padding:1px 7px;text-decoration:line-through}
  .cambio .a{background:#DDF0E3;color:var(--ok);border-radius:6px;padding:1px 7px;font-weight:700}
  .c-resuelta .cad{opacity:.85}
  .cad.salto{animation:salto 1.6s ease-out}
  /* Repaso bloqueado por SIGMA (documento de IVA pendiente de validar) */
  .cad.bloq{background:#EEECE8;border-color:#D6D2CA;color:#8A857C;cursor:not-allowed;filter:grayscale(1)}
  .cad.bloq .pie{filter:none}
  table.lista tr.bloq{background:#EEECE8;color:#8A857C;cursor:not-allowed}
  table.lista tr.bloq td{filter:grayscale(1)}
  table.lista tr.bloq td.acc-bloq{filter:none}
  .et.bloq{background:#5F5B54;color:#fff}
  .aviso-bloq{background:#EEECE8;border:1px solid #D6D2CA;border-radius:8px;padding:10px 12px;margin-top:10px;color:#5F5B54}
  @keyframes salto{0%{box-shadow:0 0 0 4px var(--c);transform:scale(1.03)}100%{box-shadow:0 0 0 0 transparent;transform:none}}
  @media (prefers-reduced-motion:reduce){.cad.salto{animation:none;outline:2px solid var(--c)}}
  @media (max-width:900px){.carriles{grid-template-columns:1fr}}

  /* Presupuestos (pestaña Presupuesto de SIGMA) */
  .p-aceptado{--c:var(--ok)}.p-sin_valorar{--c:#B8660B}.p-enviado{--c:var(--azul)}.p-rechazado{--c:var(--peligro)}
  .et.pt{background:color-mix(in srgb,var(--c) 13%,#fff);color:var(--c);font-weight:700}
  .ptto-lineas{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px;background:#fff}
  .ptto-lineas td,.ptto-lineas th{padding:4px 6px;border-top:1px solid var(--borde);text-align:left;vertical-align:top}
  .ptto-lineas th{color:var(--suave);font-weight:600}
  .ptto-res{font-size:12px;color:var(--suave);margin-top:3px}
  .ptto-res b{font-variant-numeric:tabular-nums}

  /* Informes como archivador (v2.37) */
  .pestanas{display:inline-flex;background:#ECEAE4;border-radius:9px;padding:3px;gap:2px}

<script>
/* =====================================================================
   KUBEL Oficina — v2.40 (Asignar visita en servicios cerrados o anulados: el servicio de la ficha queda elegido y la visita es solo interna, sin Repaso ni Informar cita para SIGMA y sin tocar estado, Facturación ni «Cerrado por» (SQL 22); v2.39: Fotos internas para el operario al asignar o editar una visita: van con el servicio, el operario las ve en la app y no se envían a SIGMA; v2.38: Repaso: la fecha de contacto con el cliente no puede ser anterior a la apertura del siniestro en SIGMA (código 4107); v2.37: Informes como archivador: una carpeta por servicio a la izquierda, agrupadas en Hoy / Ayer / Últimos 7 días / meses, con pestañas Todas · Sin revisar, buscador y filtro de operario; al abrir una carpeta se ven sus informes con fotos y «Marcar carpeta revisada»; v2.36: Contacto con el cliente: al planificar una visita de un servicio sin primer contacto (estado 15) la web pregunta en ese momento cuándo se contactó con el cliente (propone ahora, editable) y lo guarda en el borrador de Repaso; en Envíos a SIGMA se puede poner en la propia tarjeta; v2.35: Confirmación SIGMA: al llegar el informe del operario de un servicio sin confirmar, el robot prepara en Envíos a SIGMA un borrador «Confirmación»; la rápida la manda el robot al aprobar, la completa se hace en el portal y el robot lo comprueba; v2.34: Sin parpadeos: al marcar revisado, guardar o recibir cambios de otro ordenador/del robot ya no se vacía y repinta la página entera ni se recargan las fotos; solo cambia lo que ha cambiado; v2.33: Ventanas: botón ✕ arriba a la derecha en lugar de Cancelar/Cerrar; v2.32: Las ventanas (Nueva línea, ficha, Asignar visita…) ya no se cierran al pulsar fuera ni al soltar el ratón fuera mientras se selecciona texto: solo con Cancelar/Cerrar o Esc; v2.31: Asignar visita: si el servicio ya tiene una visita pendiente, avisa y deja elegir «Cambiar esa visita» (operario, día, hora) o «Añadir otra visita»; v2.30: Asignar visita: el botón se bloquea mientras guarda (evita visitas dobles por doble clic); también al arrastrar en Planificación y al guardar una visita; v2.29: Informes: botones «⬇ Antes» y «⬇ Después» descargan de golpe todas las fotos de ese tipo; v2.28: Sin estado «En camino» en las visitas (quitado también de la app operario v2.4); v2.27: Ficha del servicio: botones «Repaso» y «Mensaje a tramitación» junto a «Asignar visita»; Asignar visita sin campo Tipo y «Orden en la ruta» pasa a «Servicio Número»; v2.26: Presupuestos: importe total del presupuesto en SIGMA en la lista y en la ficha; al quedar aceptado el servicio entra en Facturación del panel admin; v2.25.1: Asignar visita: la hora se elige en un desplegable con las horas que admite SIGMA, en punto o y media 08:00–21:30; v2.25: Próxima visita: incluye la cita presencial marcada en SIGMA con un Repaso «Visita al Cliente»; v2.24: Presupuestos: el robot solo guarda los servicios cuyo presupuesto cambia; v2.23: Presupuestos: vista con filtros Aceptados · Pendientes de valoración · Enviados · Rechazados (gremios 11A, 77A, 30A, 10A, 76A) y partidas en la ficha; v2.22: Repaso bloqueado también en estado SIGMA 6 «Aplazamiento Pte. Cia./Perito» y 16 «presupuesto pendiente»: en gris con «Enviar a tramitación»; v2.21: contacto con el cliente: nunca posterior a ahora ni antes de las 08:00; v2.20: Inicio: nº de servicios abiertos en compañía y provincias; los contadores de provincia, pueblo, gremio y compañía se recalculan con los demás filtros; v2.19: Envíos a SIGMA: no se aprueban Repasos de servicios cerrados ni con fecha/hora pasada; v2.18: Repasos: el servicio sale de «Caducada» al instante al guardar/aprobar el Repaso; v2.17: Repasos: filtro y orden nuevos/antiguos; v2.16: [PRUEBAS] borrar visita con informes; v2.15: Repasos: Sin primer contacto no suma al contador; «Todas las provincias»; ficha con Teléfono asegurado 1/2 y perjudicado 1/2; v2.14: Inicio sin rutas, últimos informes ni «Planificar semana»; Gremio junto al buscador; Urgentes al final; v2.13: Repaso bloqueado por documento de IVA → botón «Enviar a tramitación»; v2.12: Nuevos hoy = asignados hoy por SIGMA; v2.11: servicios nuevos de hoy: etiqueta, filtro y KPI; v2.10: Repaso nuevo solo se guarda al pulsar Guardar/Aprobar; v2.9: Repaso con fecha de contacto en estado 15; v2.8: sin Operarios; «Servicio» en vez de «Parte»; filtro Gremio; Total servicios)
   Web accesible desde cualquier sitio. Datos en Supabase.
   ===================================================================== */

// ---------- Utilidades ----------
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const dos = (n) => String(n).padStart(2, '0');
const aISO = (d) => `${d.getFullYear()}-${dos(d.getMonth() + 1)}-${dos(d.getDate())}`;
const deISO = (s) => { const [a, m, d] = s.split('-').map(Number); return new Date(a, m - 1, d); };
const sumar = (iso, n) => { const d = deISO(iso); d.setDate(d.getDate() + n); return aISO(d); };
const hoyISO = () => aISO(new Date());
const DIAS = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
const DIAS_L = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const fCorta = (iso) => { const d = deISO(iso); return `${DIAS[d.getDay()]} ${d.getDate()} ${MESES[d.getMonth()]}`; };
const fLarga = (iso) => { const d = deISO(iso); return `${DIAS_L[d.getDay()]} ${d.getDate()} ${MESES[d.getMonth()]}`; };
const hCorta = (h) => (h ? h.slice(0, 5) : '');
const fHora = (ts) => { const d = new Date(ts); return `${dos(d.getDate())}/${dos(d.getMonth() + 1)}/${d.getFullYear()} ${dos(d.getHours())}:${dos(d.getMinutes())}`; };
const hace = (ts) => {
  const m = Math.round((Date.now() - new Date(ts)) / 60000);
  if (m < 1) return 'ahora'; if (m < 60) return `hace ${m} min`;
  const h = Math.round(m / 60); if (h < 24) return `hace ${h} h`;
  return fHora(ts);
};
const euros = (n) => Number(n).toFixed(2).replace('.', ',') + ' €';
const lunesDe = (iso) => { const d = deISO(iso); const dia = (d.getDay() + 6) % 7; d.setDate(d.getDate() - dia); return aISO(d); };
const ESTADOS_PARTE = ['pendiente', 'asignado', 'en_curso', 'terminado', 'cerrado', 'anulado'];
const TXT_ESTADO = { pendiente: 'Pendiente', asignado: 'Asignado', en_curso: 'En curso', terminado: 'Terminado', cerrado: 'Cerrado', anulado: 'Anulado', hecho: 'Hecho', no_realizado: 'No realizado' };
const GREMIOS = ['Fontanería', 'Albañilería', 'Pintura', 'Electricidad', 'Carpintería'];
const dirCompleta = (p) => [p?.direccion, p?.codigo_postal, p?.poblacion].filter(Boolean).join(', ');

function aviso(txt) { const a = $('#aviso'); a.textContent = txt; a.classList.remove('oculto'); clearTimeout(aviso.t); aviso.t = setTimeout(() => a.classList.add('oculto'), 3200); }
function mensaje(e) {
  const m = e?.message || String(e);
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return 'Sin conexión con el servidor. Comprueba internet.';
  if (/JWT expired/i.test(m)) return 'La sesión ha caducado. Vuelve a entrar.';
  return m;
}
function fallo(e) { console.error(e); alert('Error: ' + mensaje(e)); }
function cerrarModal() { $('#modal').innerHTML = ''; if (typeof asigEnEspera !== 'undefined') asigEnEspera = null; if (typeof limpiarFotosInternas === 'function') limpiarFotosInternas(); }
function abrirModal(html, ancho) {
  $('#modal').innerHTML = `<div class="velo"><div class="modal ${ancho ? 'ancho' : ''}"><button class="cerrar-x" onclick="cerrarModal()" title="Cerrar (Esc)" aria-label="Cerrar">✕</button>${html}</div></div>`;
}
function val(id) { return $('#' + id).value.trim(); }

// ---------- Repintado sin parpadeo (v2.34) ----------
// Antes cada cambio (propio o de otro ordenador, por tiempo real) vaciaba la página con «Cargando…»
// y la volvía a escribir entera, con enlaces de fotos nuevos → parpadeo y fotos recargadas.
// Ahora: el armazón de cada página se reutiliza y las listas se «parchean»: solo cambia lo que cambia.
function esqueleto(firma, html) {
  const c = $('#contenido');
  if (c.firstElementChild?.dataset.firma === firma && c.children.length === 1) return false;
  c.innerHTML = `<div data-firma="${esc(firma)}">${html}</div>`;
  return true;
}
function morfar(el, html) {
  if (!el) return;
  const t = document.createElement('template'); t.innerHTML = html;
  parchearHijos(el, t.content);
}
const _compat = (x, y) => x.nodeType === y.nodeType && x.nodeName === y.nodeName && (x.nodeType !== 1 || (x.id === y.id && !x.dataset.k));
function parchearHijos(a, b) {
  const libres = new Map();
  for (const n of a.childNodes) if (n.nodeType === 1 && n.dataset.k) libres.set(n.dataset.k, n);
  let cur = a.firstChild;
  for (const y of [...b.childNodes]) {
    const k = y.nodeType === 1 ? y.dataset.k : null;
    let x = null;
    if (k) { x = libres.get(k) || null; libres.delete(k); }
    else if (cur && _compat(cur, y)) x = cur;
    if (!x && !k && cur && !(cur.nodeType === 1 && cur.dataset.k)) { const s = cur.nextSibling; a.replaceChild(y, cur); cur = s; continue; } // sustituye uno por otro
    if (!x) { a.insertBefore(y, cur); continue; }
    if (x === cur) cur = cur.nextSibling; else a.insertBefore(x, cur);
    parchear(x, y);
  }
  while (cur) { const s = cur.nextSibling; cur.remove(); cur = s; }
}
function parchear(x, y) {
  if (x.nodeType !== 1) { if (x.nodeValue !== y.nodeValue) x.nodeValue = y.nodeValue; return; }
  for (const at of [...x.attributes]) if (!y.hasAttribute(at.name)) x.removeAttribute(at.name);
  for (const at of y.attributes) if (x.getAttribute(at.name) !== at.value) x.setAttribute(at.name, at.value);
  const tag = x.tagName;
  if (tag === 'TEXTAREA') { if (x !== document.activeElement) x.value = y.textContent; return; }
  if (tag === 'SELECT') {
    if (x === document.activeElement) return;
    if (x.innerHTML !== y.innerHTML) x.innerHTML = y.innerHTML;
    const s = y.querySelector('option[selected]'); if (s) x.value = s.value;
    return;
  }
  if (tag === 'INPUT') {
    if (x !== document.activeElement) { if (x.type === 'checkbox' || x.type === 'radio') x.checked = y.hasAttribute('checked'); else x.value = y.getAttribute('value') ?? ''; }
    return;
  }
  parchearHijos(x, y);
}
// Enlaces firmados de fotos: se reutilizan mientras les quede ≥ 10 min (si cambian, el navegador vuelve a bajar la foto)
const _urlFotos = new Map();
async function firmarFotos(rutas) {
  const ahora = Date.now(), urls = {}, faltan = [];
  for (const r of new Set(rutas)) { const c = _urlFotos.get(r); if (c && c.hasta - ahora > 600000) urls[r] = c.url; else faltan.push(r); }
  if (faltan.length) {
    const { data } = await sb.storage.from('fotos').createSignedUrls(faltan, 3600);
    (data || []).forEach((x) => { if (x.signedUrl) { urls[x.path] = x.signedUrl; _urlFotos.set(x.path, { url: x.signedUrl, hasta: ahora + 3600000 }); } });
  }
  return urls;
}
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if ($('#visor').innerHTML) cerrarVisor(); else cerrarModal(); } });

// ---------- Conexión ----------
let sb = null;
let yo = null;
let cache = { operarios: [], companias: [], todosPerfiles: [], codigos: {}, sinc: [] };
let vistaActual = 'inicio';

function mostrar(id) { ['v-carga', 'v-login', 'v-app'].forEach((v) => $('#' + v).classList.toggle('oculto', v !== id)); }

function alFallarSupabase() {
  $('#v-carga').innerHTML = '<div class="caja"><h1>KUBEL</h1><p>No se pudo conectar. Comprueba internet y recarga la página.</p><button onclick="location.reload()">Recargar</button></div>';
}
function alCargarSupabase() {
  if (sb) return;
  const c = window.KUBEL_CONFIG;
  sb = window.supabase.createClient(c.url, c.key);
  sb.auth.onAuthStateChange((_ev, sesion) => { setTimeout(() => alCambiarSesion(sesion), 0); });
}
if (window.KUBEL_SB === 'listo') alCargarSupabase(); else if (window.KUBEL_SB === 'error') alFallarSupabase();
document.addEventListener('supabase-listo', alCargarSupabase);
document.addEventListener('supabase-error', alFallarSupabase);

let sesionActual;
async function alCambiarSesion(sesion) {
  const id = sesion?.user?.id ?? null;
  if (id === sesionActual) return;
  sesionActual = id;
  if (!id) { yo = null; pararTiempoReal(); KubelAcceso.pintar($('#acceso'), { app: 'oficina' }); return mostrar('v-login'); }
  const { data, error } = await sb.from('perfiles').select('*').eq('id', id).single();
  // Solo cierra la sesión en este navegador; no afecta a otros dispositivos
  if (error || !data) { KubelAcceso.dejarMensaje('No se encontró tu perfil.'); return sb.auth.signOut({ scope: 'local' }); }
  if (!data.activo) { KubelAcceso.dejarMensaje('Esta cuenta está desactivada.'); return sb.auth.signOut({ scope: 'local' }); }
  // Operario y administrador se van a su web
  if (data.rol !== 'oficina') return KubelAcceso.mover(sb, sesion, data.rol);
  yo = data;
  $('#yo').textContent = yo.nombre;
  mostrar('v-app');
  await cargarCatalogos();
  arrancarTiempoReal();
  contarSinRevisar();
  contarEnvios();
  KubelAvisos.sincronizar(sb).then(pintarBotonAvisos);
  contarRepasos();
  contarPresupuestos();
  irA(location.hash.slice(1) || 'inicio');
}

// Usuario → correo interno (NANCY → nancy@kubel.app). Si lleva @ se usa tal cual (cuentas antiguas).
const aCorreo = (s) => { s = String(s || '').trim().toLowerCase(); return s && !s.includes('@') ? s + '@kubel.app' : s; };
const verUsuario = (e) => /@kubel\.app$/i.test(e || '') ? e.replace(/@kubel\.app$/i, '').toUpperCase() : (e || '—');
async function pintarBotonAvisos() {
  const b = $('#btn-avisos'); if (!b) return;
  if (!KubelAvisos.soportado()) { b.classList.add('oculto'); return; }
  const on = await KubelAvisos.activos();
  b.textContent = on ? '🔔' : '🔕';
  b.title = on ? 'Avisos activados en este dispositivo (pulsa para desactivar)' : 'Activar avisos en este dispositivo';
}
async function alternarAvisos() {
  try {
    if (await KubelAvisos.activos()) { await KubelAvisos.desactivar(sb); aviso('Avisos desactivados en este dispositivo'); }
    else { await KubelAvisos.activar(sb); aviso('🔔 Avisos activados: te llegarán los informes y las visitas no realizadas'); }
  } catch (e) { alert(mensaje(e)); }
  pintarBotonAvisos();
}

async function cargarCatalogos() {
  const [o, c] = await Promise.all([
    sb.from('perfiles').select('*').order('nombre'),
    sb.from('companias').select('*').order('nombre'),
  ]);
  cache.todosPerfiles = (o.data || []).filter((p) => p.rol !== 'admin'); // las cuentas admin solo se ven en /admin/
  cache.operarios = cache.todosPerfiles.filter((p) => p.rol === 'operario' && p.activo);
  cache.companias = c.data || [];
  const { data: cods } = await sb.from('sigma_codigos').select('tipo, codigo, texto');
  cache.codigos = {};
  (cods || []).forEach((x) => (cache.codigos[x.tipo + ':' + x.codigo] = x.texto));
  cargarSigma();
}
const nombreDe = (id) => cache.todosPerfiles.find((p) => p.id === id)?.nombre || '—';

// ---------- Tiempo real ----------
let canal = null, recargaT = null;
function arrancarTiempoReal() {
  pararTiempoReal();
  canal = sb.channel('oficina')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'asignaciones' }, (p) => alCambio('asignaciones', p))
    .on('postgres_changes', { event: '*', schema: 'public', table: 'informes' }, (p) => alCambio('informes', p))
    .on('postgres_changes', { event: '*', schema: 'public', table: 'partes' }, (p) => alCambio('partes', p))
    .on('postgres_changes', { event: '*', schema: 'public', table: 'sigma_sincronizaciones' }, () => cargarSigma())
    .on('postgres_changes', { event: '*', schema: 'public', table: 'sigma_envios' }, (p) => alCambioEnvio(p))
    .subscribe((estado) => $('#vivo').classList.toggle('off', estado !== 'SUBSCRIBED'));
}
function pararTiempoReal() { if (canal) { sb.removeChannel(canal); canal = null; } }
function alCambio(tabla, p) {
  if (tabla === 'informes' && p.eventType === 'INSERT') {
    aviso(`📝 Nuevo informe de ${nombreDe(p.new.operario_id)}`);
  } else if (tabla === 'asignaciones' && p.eventType === 'UPDATE' && p.old?.estado !== p.new?.estado && p.new?.estado) {
    if (p.new.estado === 'no_realizado') aviso(`⚠️ ${nombreDe(p.new.operario_id)}: visita no realizada`);

    enviosLocales.set(e.parte_id, { id: 'local', tipo: 'repaso', estado: aprobar ? 'aprobado' : 'borrador', creado_en: new Date().toISOString(), local: true });
    cerrarModal(); marcarRepasoLocal(e.parte_id);
  }
  let error;
  if (esNuevo) {
    // Se crea como borrador y, si se aprueba, se pasa a aprobado (el disparo inmediato salta al cambiar el estado)
    const { estado, resultado, ...datos } = fila;
    const r = await sb.from('sigma_envios').insert({ parte_id: e.parte_id, tipo: e.tipo, origen: 'manual', ...datos }).select('id').single();
    error = r.error;
    if (!error && aprobar) error = (await sb.from('sigma_envios').update({ estado: 'aprobado', resultado: null }).eq('id', r.data.id)).error;
  } else error = (await sb.from('sigma_envios').update(fila).eq('id', id)).error;
  guardandoEnvio = false;
  if (error) {
    if (local) { enviosLocales.delete(e.parte_id); if (vistaActual === 'repasos') vistaRepasos(); }
    return fallo(error);
  }
  if (esNuevo) envioNuevo = null;
  if (aprobar) aviso(e.tipo === 'tramitacion' ? 'Enviando el mensaje a tramitación…' : e.tipo === 'confirmacion' ? 'Aprobada: confirmando en SIGMA…' : 'Aprobado: enviándolo a SIGMA…'); else if (!problema) aviso('Guardado');
  cerrarModal(); contarEnvios(); if (vistaActual === 'envios') vistaEnvios(); if (vistaActual === 'repasos') vistaRepasos();
}

// ---------- Nuevos / antiguos (común a las clasificaciones de Repasos) ----------
// Antigüedad = «Fecha/Hora Asignación» de la ficha SIGMA (si aún no hay ficha, cuándo entró en el hub).
// Nuevo = asignado hoy (misma regla que en Inicio). Sirve para ordenar la prioridad del repaso.
const SEL_ASIG = 'origen, creado_en, asig:sigma_ficha->>asignacion';
const OPC_ANTIG = [['antiguos', 'Antiguos primero'], ['nuevos', 'Nuevos primero'], ['solo_nuevos', 'Solo nuevos de hoy'], ['solo_antiguos', 'Solo antiguos']];
let filtroAntig = 'antiguos';
function fechaAsig(p) {
  const m = String(p.asig || '').match(/(\d{2})\/(\d{2})\/(\d{4})(?:\D+(\d{2}):(\d{2}))?/);
  if (m) return new Date(+m[3], m[2] - 1, +m[1], +(m[4] || 0), +(m[5] || 0));
  return p.creado_en ? new Date(p.creado_en) : null;
}
function esNuevoRep(p) { const d = fechaAsig(p); return !!d && d >= new Date(inicioHoyISO()); }
function filtrarAntig(lista) {
  if (filtroAntig === 'solo_nuevos') return lista.filter(esNuevoRep);
  if (filtroAntig === 'solo_antiguos') return lista.filter((p) => !esNuevoRep(p));
  return lista;
}
function ordenAntig(a, b) {
  const ta = fechaAsig(a)?.getTime() ?? 0, tb = fechaAsig(b)?.getTime() ?? 0;
  return filtroAntig === 'nuevos' ? tb - ta : ta - tb;
}
function selectAntig(id) {
  return `<select id="${id}" style="max-width:190px" title="Ordenar por fecha de asignación de SIGMA">${OPC_ANTIG.map(([v, t]) => `<option value="${v}" ${v === filtroAntig ? 'selected' : ''}>${t}</option>`).join('')}</select>`;
}
function etiquetaAntig(p) {
  const d = fechaAsig(p);
  if (!d) return '';
  if (esNuevoRep(p)) return `<span class="et nuevo" title="Asignado hoy a las ${dos(d.getHours())}:${dos(d.getMinutes())}">NUEVO</span>`;
  const dias = Math.round((new Date(inicioHoyISO()) - new Date(d.getFullYear(), d.getMonth(), d.getDate())) / 864e5);
  return `<span class="et" title="Asignado el ${dos(d.getDate())}/${dos(d.getMonth() + 1)}/${d.getFullYear()}">${dias === 1 ? 'Ayer' : 'Hace ' + dias + ' d'}</span>`;
}

// ---------- Clasificador: CADUCADAS / CADUCAN HOY ----------
// El robot lee el filtro Caducidad del listado del portal (REDES / RESTO / CLIENTE) y guarda en cada
// parte cuándo entró (sigma_cad_desde) y cuándo salió (sigma_cad_hasta) con el estado de antes y después.
// Aquí se ven en carriles de izquierda a derecha según avanza el repaso de la mañana:
//   Caducada → Repaso en bandeja → Enviado (esperando al portal) → Resuelta hoy
const GRUPOS_CAD = {
  redes: { nombre: 'REDES', ayuda: 'Nos toca a nosotros: contactar, citar o visitar' },
  resto: { nombre: 'RESTO', ayuda: 'Pendientes de compañía, perito o MA' },
  cliente: { nombre: 'CLIENTE', ayuda: 'Pendientes de instrucciones del cliente' },
};
const CARRILES_CAD = [
  ['caducada', 'Caducada', 'Sin repaso preparado'],
  ['bandeja', 'Repaso en bandeja', 'Preparado; falta aprobar o enviar'],
  ['enviada', 'Enviado', 'Esperando a que el portal lo actualice'],
  ['resuelta', 'Resuelta hoy', 'Ya no sale como caducada'],
];
let filtroCadGrupo = '', filtroCadCuenta = '';
const carrilAntes = new Map();
const inicioHoy = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d.toISOString(); };
const textoEstado = (c) => (c ? `${c} · ${codigo('estado', c) || 'estado ' + c}` : '');

async function contarCaducadas() {
  const { count, error } = await sb.from('partes').select('id', { count: 'exact', head: true })
    .not('sigma_cad_desde', 'is', null).is('sigma_cad_hasta', null).eq('sigma_en_curso', true);
  if (error) throw error;
  return count || 0;
}
function carrilDe(p) {
  if (p.sigma_cad_hasta) return 'resuelta';
  const desde = p.sigma_cad_desde || '';
  const env = (p.sigma_envios || []).filter((e) => e.tipo === 'repaso' && e.estado !== 'descartado' && (e.creado_en >= desde || ['borrador', 'aprobado', 'enviando', 'error'].includes(e.estado)));
  if (env.some((e) => ['borrador', 'aprobado', 'enviando', 'error'].includes(e.estado))) return 'bandeja';
  if (env.some((e) => e.estado === 'enviado')) return 'enviada';
  return 'caducada';
}
function tarjetaCad(p, carril) {
  const g = GRUPOS_CAD[p.sigma_cad_grupo];
  const tels = listaTels(p.telefono, p.telefono2);
  const envs = (p.sigma_envios || []).filter((e) => e.tipo === 'repaso' && e.estado !== 'descartado').sort((a, b) => b.creado_en.localeCompare(a.creado_en));
  const pend = envs.find((e) => ['borrador', 'aprobado', 'enviando', 'error'].includes(e.estado));
  const env = envs.find((e) => e.estado === 'enviado');
  let estado, accion;
  if (carril === 'resuelta') {
    estado = `<div class="cambio"><span class="de" title="Estado al caducar">${esc(textoEstado(p.sigma_cad_estado))}</span>→<span class="a" title="Estado ahora">${p.sigma_cad_estado_fin ? esc(textoEstado(p.sigma_cad_estado_fin)) : 'Fuera de curso'}</span></div>`;
    accion = `<span class="met">Resuelta ${hace(p.sigma_cad_hasta)}</span>`;
  } else {
    estado = `<div class="est">${esc(textoEstado(p.sigma_estado))}</div>`;
    if (carril === 'bandeja' && pend.local) accion = `<span class="et ${pend.estado}">${pend.estado === 'aprobado' ? 'Enviando…' : 'Guardando…'}</span>`;
    else if (carril === 'bandeja') accion = `<span class="et ${pend.estado}">${TXT_ENVIO[pend.estado]}</span> <button class="mini ${pend.estado === 'error' ? 'peligro' : ''}" onclick="modalEnvio('${pend.id}')">${pend.estado === 'borrador' || pend.estado === 'error' ? 'Revisar y enviar' : 'Ver'}</button>`;
    else if (carril === 'enviada') accion = `<span class="met">Enviado ${env?.enviado_en ? hace(env.enviado_en) : ''}</span>`;
    else accion = `<button class="mini acento" onclick="nuevoEnvio('${p.id}')">Repaso</button>`;
    if (ivaBloq(p)) { // SIGMA bloquea el Repaso: tarjeta en gris, sin entrar; solo mensaje a tramitación
      const ult = ultimaTramitacion(p);
      accion = `<span class="et bloq" title="${esc(txtBloq(p))}">🔒 ${esc(etqBloq(p))}</span> ${botonTramitacion(p.id)}${ult ? `<span class="met" style="width:100%">${esc(ult)}</span>` : ''}`;
    }
  }
  const salto = carrilAntes.has(p.id) && carrilAntes.get(p.id) !== carril;
  const bloq = ivaBloq(p) && carril !== 'resuelta';
  return `<div class="cad ${salto ? 'salto' : ''} ${bloq ? 'bloq' : ''}" data-k="${p.id}" ${bloq ? `title="${esc(txtBloq(p))}"` : `onclick="modalParte('${p.id}')"`}>
    <div class="l1">${p.sigma_alerta ? `<span class="punto ${p.sigma_alerta}" title="Alerta ${p.sigma_alerta}"></span>` : ''}<b>${esc(p.numero_servicio)}</b>
      ${etiquetaAntig(p)} ${p.urgente ? '<span class="et urg">URG</span>' : ''}<span class="esp"></span>
      ${g ? `<span class="et gr g-${p.sigma_cad_grupo}">${g.nombre}</span>` : ''}<span class="et sigma">SIGMA ${p.sigma_cuenta === 'PAL' ? 'PALENCIA' : 'VALLADOLID'}</span></div>
    ${estado}
    <div class="met">${esc(p.asegurado || '—')}${tels.length ? ' · ' + tels.map((t) => `<a href="tel:${esc(t)}" onclick="event.stopPropagation()">${esc(t)}</a>`).join(' · ') : ''}</div>
    <div class="met">${esc([p.direccion, p.poblacion].filter(Boolean).join(', '))}</div>
    ${carril !== 'resuelta' && p.sigma_caducidad !== null && p.sigma_caducidad !== undefined ? `<div class="met">Caducidad ${p.sigma_caducidad} d${p.sigma_llamadas ? ' · ' + p.sigma_llamadas + ' llamadas' : ''} · en la lista ${hace(p.sigma_cad_desde)}</div>` : ''}
    <div class="pie" onclick="event.stopPropagation()">${accion}<span class="esp"></span>
      <a class="mini" href="https://web.multiasistencia.com/w3multi/repasos1.php?reparacion=${encodeURIComponent(p.numero_servicio)}" target="_blank" rel="noopener" title="Abrir en el portal">↗</a></div>
  </div>`;
}
async function pintarCaducadas(destino) {
  if (!$('#cad-raiz')) {
    destino.innerHTML = `<div id="cad-raiz">
      <div class="barra" style="margin-bottom:8px">
        <select id="cad-cuenta" style="max-width:190px"><option value="">Todas las provincias</option>${Object.entries(CUENTAS_SIGMA).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select>
        ${selectAntig('cad-antig')}

    $('#cad-cuenta').onchange = (e) => { filtroCadCuenta = e.target.value; pintarCaducadas(destino); };
    $('#cad-antig').onchange = (e) => { filtroAntig = e.target.value; pintarCaducadas(destino); };
  }
  let q = sb.from('partes').select(`id, numero_servicio, asegurado, telefono, telefono2, direccion, poblacion, urgente, sigma_cuenta, sigma_alerta, sigma_estado, sigma_caducidad, sigma_llamadas, sigma_cad_grupo, sigma_cad_desde, sigma_cad_hasta, sigma_cad_estado, sigma_cad_estado_fin, sigma_iva_pendiente, ${SEL_ASIG}, sigma_envios(id, tipo, estado, creado_en, enviado_en)`)
    .not('sigma_cad_desde', 'is', null).or(`sigma_cad_hasta.is.null,sigma_cad_hasta.gte.${inicioHoy()}`);
  if (filtroCadCuenta) q = q.eq('sigma_cuenta', filtroCadCuenta);
  const { data, error } = await q;
  if (error) return fallo(error);
  datosCad = data || [];
  pintarTableroCad();
}
let datosCad = null;
function pintarTableroCad() {
  if (!$('#cad-tablero')) return;
  $('#cad-antig').value = filtroAntig;
  const todas = filtrarAntig(datosCad.map(conLocales).map((p) => ({ ...p, carril: carrilDe(p) })));

  // Grupos: pendientes y avance del día
  const resumen = (lista) => { const res = lista.filter((p) => p.carril === 'resuelta').length; return { pend: lista.length - res, res, tot: lista.length }; };
  const tile = (id, nombre, ayuda, r) => `<button class="cad-g g-${id} ${filtroCadGrupo === (id === 'todas' ? '' : id) ? 'activo' : ''}" onclick="filtroCadGrupo='${id === 'todas' ? '' : id}';pintarCaducadas($('#rep-cont'))">
    <div class="t">${nombre}</div><div class="n">${r.pend}<small>por repasar</small></div>
    <div class="s">${ayuda}</div>
    <div class="progreso" title="${r.res} de ${r.tot} resueltas hoy"><div style="width:${r.tot ? Math.round((r.res / r.tot) * 100) : 0}%"></div></div>
    <div class="s">${r.res} de ${r.tot} resueltas hoy</div></button>`;
  morfar($('#cad-grupos'), tile('todas', 'Todas', 'Caducadas o caducan hoy', resumen(todas))
    + Object.entries(GRUPOS_CAD).map(([id, g]) => tile(id, g.nombre, g.ayuda, resumen(todas.filter((p) => p.sigma_cad_grupo === id)))).join(''));

  const ult = Object.values(ultimaSigma()).map((s) => s.fin).sort().pop();
  $('#cad-leido').textContent = ult ? `Portal leído ${hace(ult)} · se actualiza solo cada 15 min` : '';

  const lista = todas.filter((p) => !filtroCadGrupo || p.sigma_cad_grupo === filtroCadGrupo);
  const orden = { rojo: 0, amarillo: 1, verde: 2 };
  if (!todas.length) {
    morfar($('#cad-tablero'), filtroAntig.startsWith('solo_') ? '<div class="tarjeta vacio">No hay servicios con este filtro.</div>' : '<div class="tarjeta vacio">No hay servicios caducados ni que caduquen hoy. 👍<br><small>Si acabas de activar esta vista, aparecerán tras la próxima lectura del portal.</small></div>');
  } else {
    morfar($('#cad-tablero'), `<div class="carriles">${CARRILES_CAD.map(([id, nombre, ayuda]) => {
      const en = lista.filter((p) => p.carril === id).sort(id === 'resuelta'
        ? (a, b) => b.sigma_cad_hasta.localeCompare(a.sigma_cad_hasta)
        : (a, b) => (ivaBloq(a) - ivaBloq(b)) || ordenAntig(a, b) || (b.urgente - a.urgente) || ((orden[a.sigma_alerta] ?? 3) - (orden[b.sigma_alerta] ?? 3)) || ((b.sigma_caducidad ?? -99) - (a.sigma_caducidad ?? -99)));
      return `<section class="carril c-${id}"><h3>${nombre}<span class="n">${en.length}</span></h3><p>${ayuda}</p>
        ${en.map((p) => tarjetaCad(p, id)).join('') || '<div class="vacio" style="padding:10px;font-size:12px">—</div>'}</section>`;
    }).join('')}</div>`);
  }
  // Avisar de lo que acaba de cambiar de carril y recordar el carril de cada uno
  for (const p of todas) {
    const antes = carrilAntes.get(p.id);
    if (antes && antes !== p.carril && p.carril === 'resuelta') aviso(`✅ ${p.numero_servicio} ya no está caducada`);
    carrilAntes.set(p.id, p.carril);
  }
}

// ---------- Clasificador: SIN PRIMER CONTACTO ----------
// Partes SIGMA en los que aún no se ha hablado con el cliente. Los marca el robot
// con la lista "Pendiente de primer contacto" de Gestión repaso del portal y el estado 15.
async function contarSinContacto() {
  const { count, error } = await sb.from('partes').select('id', { count: 'exact', head: true }).eq('sigma_sin_contacto', true).eq('sigma_en_curso', true);
  if (error) throw error;
  return count || 0;
}
let filtroSinContacto = '';
// "Primer contacto con cliente (16/10/2026 - 12:04)" → fecha límite que da SIGMA para el primer contacto
function plazoContacto(p) {
  const m = String(p.sigma_estado === '15' ? p.sigma_estado_texto || '' : '').match(/\((\d{2})\/(\d{2})\/(\d{4})\s*-\s*(\d{2}):(\d{2})\)/);
  return m ? new Date(+m[3], m[2] - 1, +m[1], +m[4], +m[5]) : null;
}
function textoPlazo(d) {
  if (!d) return '';
  const min = Math.round((d - Date.now()) / 60000);
  const cuando = `${dos(d.getDate())}/${dos(d.getMonth() + 1)} ${dos(d.getHours())}:${dos(d.getMinutes())}`;
  if (min < 0) return `<span class="et urg" title="Plazo de SIGMA para el primer contacto">Vencido ${cuando}</span>`;
  if (min < 24 * 60) return `<span class="et pendiente" title="Plazo de SIGMA para el primer contacto">Vence ${cuando}</span>`;
  return `<span class="et" title="Plazo de SIGMA para el primer contacto">Plazo ${cuando}</span>`;
}

  if (!$('#sc-raiz')) {
    destino.innerHTML = `<div id="sc-raiz">

    <tbody>${lista.map((p) => {

      const pendEnvio = (p.sigma_envios || []).some((e) => e.tipo === 'repaso' && ['borrador', 'aprobado', 'enviando'].includes(e.estado));
      const prox = proximaVisita(p, hoy);
      const bloq = ivaBloq(p);
      return `<tr data-k="${p.id}" class="${bloq ? 'bloq' : 'clic'}" ${bloq ? `title="${esc(txtBloq(p))}"` : `onclick="modalParte('${p.id}')"`}>
        <td><b>${esc(p.numero_servicio)}</b> ${etiquetaAntig(p)} ${p.urgente ? '<span class="et urg">URG</span>' : ''}<br>${etiquetaSigma(p)}</td>
        <td>${esc(p.asegurado || '—')}${tels.map((t) => `<br><a href="tel:${esc(t)}" onclick="event.stopPropagation()">${esc(t)}</a>`).join('')}</td>

        <td class="opc">${esc(p.gremio || '')}</td>
        <td>${textoPlazo(p.plazo) || '—'}${p.sigma_caducidad !== null && p.sigma_caducidad !== undefined ? `<br><small style="color:var(--suave)">cad. ${p.sigma_caducidad} d${p.sigma_llamadas ? ' · ' + p.sigma_llamadas + ' llamadas' : ''}</small>` : ''}</td>

        <td style="white-space:nowrap" class="${bloq ? 'acc-bloq' : ''}" onclick="event.stopPropagation()">

          <a class="mini" href="https://web.multiasistencia.com/w3multi/repasos1.php?reparacion=${encodeURIComponent(p.numero_servicio)}" target="_blank" rel="noopener" title="Abrir en el portal" style="margin-left:6px">↗</a></td>

    : filtroAntig.startsWith('solo_') ? '<div class="tarjeta vacio">No hay servicios con este filtro.</div>' : '<div class="tarjeta vacio">No hay servicios pendientes de primer contacto. 👍</div>');
}

// =====================================================================
//  PRESUPUESTOS — pestaña «Presupuesto» del portal SIGMA (gremios 11A, 77A, 30A, 10A y 76A)
//  Los clasifica el robot sigma-presupuestos cada 30 min (partes.sigma_ptto_*). Reglas de la oficina (21/10/2026):
//   · Aceptado: en la última fecha con decisión hay alguna partida ACEPTADO (por compañía o por MA)
//   · Rechazado: en la última fecha con decisión solo hay partidas RECHAZADO → volver a valorar
//   · Enviado: hay partidas «Pendiente», esperando respuesta de compañía/MA
//   · Pendiente de valoración: ninguna partida subida (o el portal aún no deja valorar: 'bloqueado', con su motivo)
// =====================================================================
const GREMIOS_PTTO = ['11A', '77A', '30A', '10A', '76A'];
const FILTROS_PTTO = [
  { id: 'aceptado', nombre: 'Aceptados', ayuda: 'Baremos aceptados por compañía o MA', estados: ['aceptado'] },
  { id: 'sin_valorar', nombre: 'Pendientes de valoración', ayuda: 'Sin ninguna valoración subida', estados: ['sin_valorar', 'bloqueado'] },
  { id: 'enviado', nombre: 'Enviados', ayuda: 'Valorados, pendientes de respuesta', estados: ['enviado'] },
  { id: 'rechazado', nombre: 'Rechazados', ayuda: 'Pendientes de volver a valorar', estados: ['rechazado'] },
];
const TXT_PTTO = { aceptado: 'Aceptado', sin_valorar: 'Sin valorar', bloqueado: 'Sin valorar', enviado: 'Enviado', rechazado: 'Rechazado' };
const grupoPtto = (e) => (e === 'bloqueado' ? 'sin_valorar' : e);
let filtroPtto = 'rechazado', filtroPttoCuenta = '', filtroPttoGremio = '', datosPtto = null;

function consultaPtto(campos, opciones) {
  return sb.from('partes').select(campos, opciones).eq('sigma_en_curso', true).in('sigma_gremio', GREMIOS_PTTO).not('estado', 'in', '(cerrado,anulado)');
}
async function contarPresupuestos() {
  const { count } = await consultaPtto('id', { count: 'exact', head: true }).eq('sigma_ptto_estado', 'rechazado');
  const b = $('#b-ptto'); if (b) { b.textContent = count || ''; b.classList.toggle('oculto', !count); b.title = 'Rechazados pendientes de volver a valorar'; }
}
// Resumen corto de las partidas: «3 aceptadas · 2 rechazadas · última decisión 24/09/2026»
function resumenPtto(p) {
  const l = p.sigma_ptto_lineas || [];
  if (p.sigma_ptto_estado === 'bloqueado') return `<span title="Lo dice el portal al abrir la pestaña Presupuesto">🔒 ${esc(p.sigma_ptto_motivo || 'El portal aún no deja valorar')}</span>`;
  if (!l.length) return 'Ninguna partida subida';
  const n = (re) => l.filter((x) => re.test(x.estado)).length;
  const ult = p.sigma_ptto_fecha ? l.filter((x) => x.fecha === p.sigma_ptto_fecha) : [];
  const partes = [];
  const pend = n(/^pendiente/i);
  if (pend) partes.push(`<b>${pend}</b> pendiente${pend > 1 ? 's' : ''} de respuesta`);
  if (p.sigma_ptto_fecha) {
    const a = ult.filter((x) => /ACEPTAD/i.test(x.estado)).length, r = ult.filter((x) => /RECHAZAD/i.test(x.estado)).length;
    const quien = [...new Set(ult.map((x) => (/ MA$/i.test(x.estado) ? 'MA' : /COMPA/i.test(x.estado) ? 'compañía' : '')).filter(Boolean))].join(' y ');
    partes.push(`${fDMA(p.sigma_ptto_fecha)}${quien ? ' (' + quien + ')' : ''}: ${[a ? `<b>${a}</b> aceptada${a > 1 ? 's' : ''}` : '', r ? `<b>${r}</b> rechazada${r > 1 ? 's' : ''}` : ''].filter(Boolean).join(', ')}`);
  }
  return `${l.length} partida${l.length > 1 ? 's' : ''} · ${partes.join(' · ')}`;
}
// «Importe total» que muestra el portal al final de la pestaña Presupuesto (sin IVA)
function totalPtto(p, largo) {
  if (p.sigma_ptto_total == null) return '';
  const v = Number(p.sigma_ptto_total).toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
  return largo ? ` · Importe total <b>${v}</b>` : ` <b style="white-space:nowrap" title="Importe total del presupuesto en SIGMA (sin IVA)">${v}</b>`;
}
function bloquePresupuesto(p) {
  if (!p.sigma_ptto_estado) return '';
  const l = p.sigma_ptto_lineas || [];
  const g = grupoPtto(p.sigma_ptto_estado);
  return `<details ${g === 'rechazado' ? 'open' : ''}><summary>Presupuesto en el portal <span class="et pt p-${g}">${TXT_PTTO[p.sigma_ptto_estado]}</span></summary>
    <div class="ptto-res">${resumenPtto(p)}${totalPtto(p, true)}</div>
    ${l.length ? `<table class="ptto-lineas"><thead><tr><th>Baremo</th><th>Descripción</th><th>Uds.</th><th>Estado</th><th>Fecha</th></tr></thead><tbody>
      ${l.map((x) => `<tr><td><b>${esc(x.baremo)}</b></td><td>${esc(x.descripcion)}</td><td>${esc(x.unidades)}</td>
        <td style="color:${/ACEPTAD/i.test(x.estado) ? 'var(--ok)' : /RECHAZAD/i.test(x.estado) ? 'var(--peligro)' : 'var(--azul)'};font-weight:600">${esc(x.estado)}</td><td>${esc(fDMA(x.fecha) || '—')}</td></tr>`).join('')}
    </tbody></table>` : ''}
    <div style="font-size:11px;color:var(--suave);margin-top:4px">Se comprueba en el portal cada 30 min${p.sigma_ptto_revisado_en ? ' · último cambio ' + hace(p.sigma_ptto_revisado_en) : ''}
      · <a href="https://web.multiasistencia.com/w3multi/valprincipal.php?reparacion=${encodeURIComponent(p.numero_servicio)}&modo=0" target="_blank" rel="noopener">Abrir Presupuesto en el portal ↗</a></div>
  </details>`;
}

async function vistaPresupuestos() {
  if (!$('#ptto-raiz')) {
    $('#contenido').innerHTML = `<div id="ptto-raiz">
      <div class="barra"><h2>Presupuestos</h2>
        <select id="ptto-cuenta" style="max-width:190px"><option value="">Todas las provincias</option>${Object.entries(CUENTAS_SIGMA).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select>
        <select id="ptto-gremio" style="max-width:240px"><option value="">Todos los gremios (${GREMIOS_PTTO.length})</option>${GREMIOS_PTTO.map((g) => `<option value="${g}">${g}${codigo('gremio', g) ? ' · ' + esc(codigo('gremio', g)) : ''}</option>`).join('')}</select>
        <span class="esp"></span><span id="ptto-leido" style="font-size:12px;color:var(--suave)"></span></div>
      <div class="cad-grupos" id="ptto-filtros"></div>
      <div id="ptto-lista">Cargando…</div></div>`;
    $('#ptto-cuenta').value = filtroPttoCuenta;
    $('#ptto-gremio').value = filtroPttoGremio;
    $('#ptto-cuenta').onchange = (e) => { filtroPttoCuenta = e.target.value; pintarPresupuestos(); };
    $('#ptto-gremio').onchange = (e) => { filtroPttoGremio = e.target.value; pintarPresupuestos(); };
  }
  const { data, error } = await consultaPtto(`id, numero_servicio, asegurado, telefono, telefono2, direccion, poblacion, gremio, urgente, estado, sigma_cuenta, sigma_alerta, sigma_en_curso, sigma_gremio, sigma_ptto_estado, sigma_ptto_motivo, sigma_ptto_lineas, sigma_ptto_fecha, sigma_ptto_total, sigma_ptto_desde, sigma_ptto_revisado_en, ${SEL_ASIG}`);
  if (error) return fallo(error);
  datosPtto = data || [];
  pintarPresupuestos();
  contarPresupuestos();
}

function pintarPresupuestos() {
  if (!datosPtto || !$('#ptto-raiz')) return;
  const base = datosPtto.filter((p) => (!filtroPttoCuenta || p.sigma_cuenta === filtroPttoCuenta) && (!filtroPttoGremio || p.sigma_gremio === filtroPttoGremio));
  const de = (f) => base.filter((p) => f.estados.includes(p.sigma_ptto_estado));
  const sinLeer = base.filter((p) => !p.sigma_ptto_estado).length;
  morfar($('#ptto-filtros'), FILTROS_PTTO.map((f) => {
    const n = de(f).length;
    const bloq = f.id === 'sin_valorar' ? de(f).filter((p) => p.sigma_ptto_estado === 'bloqueado').length : 0;
    return `<button class="cad-g p-${f.id} ${filtroPtto === f.id ? 'activo' : ''}" onclick="filtroPtto='${f.id}';pintarPresupuestos()">
      <div class="t">${f.nombre}</div><div class="n">${n}</div><div class="s">${f.ayuda}${bloq ? ` · ${bloq} bloqueado${bloq > 1 ? 's' : ''} por el portal` : ''}</div></button>`;
  }).join(''));
  $('#ptto-leido').textContent = 'Se lee del portal cada 30 min';
  const f = FILTROS_PTTO.find((x) => x.id === filtroPtto) || FILTROS_PTTO[0];
  // Orden: rechazados y enviados por la fecha de la última decisión (los más viejos primero); el resto por antigüedad del servicio
  const lista = de(f).sort((a, b) => (f.id === 'rechazado' || f.id === 'enviado' ? String(a.sigma_ptto_fecha || '').localeCompare(String(b.sigma_ptto_fecha || '')) : 0)
    || (f.id === 'sin_valorar' ? (a.sigma_ptto_estado === 'bloqueado') - (b.sigma_ptto_estado === 'bloqueado') : 0)
    || ((fechaAsig(a)?.getTime() ?? 0) - (fechaAsig(b)?.getTime() ?? 0)));
  const portal = (n) => `https://web.multiasistencia.com/w3multi/valprincipal.php?reparacion=${encodeURIComponent(n)}&modo=0`;
  morfar($('#ptto-lista'), (lista.length ? `
    <div style="overflow-x:auto"><table class="lista"><thead><tr><th>Nº servicio</th><th>Cliente</th><th>Dirección</th><th class="opc">Gremio</th><th>Presupuesto</th><th>En este estado</th><th></th></tr></thead>
    <tbody>${lista.map((p) => {
      const tels = listaTels(p.telefono, p.telefono2);
      return `<tr data-k="${p.id}" class="clic p-${grupoPtto(p.sigma_ptto_estado)}" onclick="modalParte('${p.id}')">
        <td><b>${esc(p.numero_servicio)}</b> ${etiquetaAntig(p)} ${p.urgente ? '<span class="et urg">URG</span>' : ''}<br>${etiquetaSigma(p)}</td>
        <td>${esc(p.asegurado || '—')}${tels.slice(0, 1).map((t) => `<br><a href="tel:${esc(t)}" onclick="event.stopPropagation()">${esc(t)}</a>`).join('')}</td>
        <td>${esc(p.direccion)}${p.poblacion ? '<br><small style="color:var(--suave)">' + esc(p.poblacion) + '</small>' : ''}</td>
        <td class="opc"><b>${esc(p.sigma_gremio)}</b><br><small style="color:var(--suave)">${esc(codigo('gremio', p.sigma_gremio) || p.gremio || '')}</small></td>
        <td><span class="et pt p-${grupoPtto(p.sigma_ptto_estado)}">${TXT_PTTO[p.sigma_ptto_estado]}</span>${totalPtto(p)}<div class="ptto-res">${resumenPtto(p)}</div></td>
        <td>${p.sigma_ptto_desde ? hace(p.sigma_ptto_desde) : '—'}</td>
        <td onclick="event.stopPropagation()"><a class="mini" href="${portal(p.numero_servicio)}" target="_blank" rel="noopener" title="Abrir la pestaña Presupuesto en el portal">Portal ↗</a></td>
      </tr>`;
    }).join('')}</tbody></table></div>
    <p style="color:var(--suave);font-size:12px">${lista.length} servicio(s) · ${esc(f.nombre.toLowerCase())}</p>`
    : `<div class="tarjeta vacio">No hay servicios en «${esc(f.nombre)}» con estos filtros.</div>`)
    + (sinLeer ? `<p style="color:var(--suave);font-size:12px">${sinLeer} servicio(s) de estos gremios aún sin leer del portal: aparecerán tras la próxima lectura.</p>` : ''));
}

function verRuta(dirs) {
  if (!dirs.length) return;
  const l = dirs.slice(0, 10);
  let url = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(l[l.length - 1])}&travelmode=driving`;
  if (l.length > 1) url += `&waypoints=${encodeURIComponent(l.slice(0, -1).join('|'))}`;
  window.open(url, '_blank', 'noopener');
}

let semana = lunesDe(hoyISO());
let arrastrando = null;
// Evita guardar dos veces lo mismo (doble clic o pulsar otra vez mientras tarda)
let guardandoVisita = false;
async function sinRepetir(fn) {
  if (guardandoVisita) return;
  guardandoVisita = true;
  const botones = [...document.querySelectorAll('.modal .acciones button')];
  botones.forEach((b) => (b.disabled = true));
  try { await fn(); } finally { guardandoVisita = false; botones.forEach((b) => (b.disabled = false)); }
}

  esqueleto('plan:' + semana + ':' + hoy, `

      <h2>Planificación</h2>
      <button class="sec" onclick="semana=sumar(semana,-7);vistaPlan()">‹ Anterior</button>
      <button class="sec" onclick="semana=lunesDe(hoyISO());vistaPlan()">Esta semana</button>

          <span style="--c:var(--ok)">Hecho</span><span style="--c:var(--peligro)">Urgente / No realizado</span>
        </div>
      </div>
    </div>`);

  const [asig, sinPlan] = await Promise.all([
    sb.from('asignaciones')
      .select('id, fecha, hora, orden, tipo, estado, notas, operario_id, parte:partes!asignaciones_parte_id_fkey(id, numero_servicio, direccion, poblacion, gremio, urgente)')
      .gte('fecha', dias[0]).lte('fecha', dias[6])
      .order('orden').order('hora', { nullsFirst: false }),
    sb.from('partes').select('id, numero_servicio, direccion, poblacion, gremio, urgente, sigma_alerta, sigma_caducidad, compania:companias(nombre)')
      .eq('estado', 'pendiente').order('urgente', { ascending: false }).order('sigma_caducidad', { ascending: true, nullsFirst: false }).order('creado_en'),
  ]);
  if (asig.error) return fallo(asig.error);

  morfar($('#sin-plan'), (sinPlan.data || []).map((p) => `
    <div class="chip ${p.urgente ? 'urgente' : ''}" data-k="${p.id}" draggable="true"
         ondragstart="arrastrando={tipo:'parte',id:'${p.id}'}" onclick="modalAsignar({parteId:'${p.id}'})">
      <b>${p.sigma_alerta ? `<span class="punto ${p.sigma_alerta}" title="Alerta SIGMA"></span>` : ''}${esc(p.numero_servicio)} ${p.urgente ? '· URGENTE' : ''}</b>
      <div class="dir">${esc(p.direccion)}${p.poblacion ? ', ' + esc(p.poblacion) : ''}</div>
      <div class="dir">${esc([p.compania?.nombre, p.gremio].filter(Boolean).join(' · '))}</div>
    </div>`).join('') || '<div class="vacio">No hay servicios pendientes 🎉</div>');

  if (!cache.operarios.length) {
    morfar($('#filas'), `<tr><td colspan="8" class="vacio">No hay operarios todavía. Créalos en el panel de administrador.</td></tr>`);
    return;
  }
  const porCelda = {};
  (asig.data || []).forEach((a) => { (porCelda[a.operario_id + '|' + a.fecha] ??= []).push(a); });
  morfar($('#filas'), cache.operarios.map((op) => `

// ---------- Fotos internas para el operario (v2.39) ----------
// La oficina las añade al asignar o editar una visita. Van ligadas al servicio (tabla fotos_internas,
// archivo fotos/internas/<servicio>/<uuid>.jpg): el operario las ve en todas sus visitas de ese servicio.

let fiNuevas = [], fiParte = null, fiExistentes = [], fiCargado = null;

}
async function pintarFotosInternas() {
  const caja = $('#fi-lista'); if (!caja) return;

async function comprimirFotoInterna(file) {
  const MAX = 1920; let fuente, w, h;

  catch { fuente = await new Promise((ok, mal) => { const i = new Image(); i.onload = () => ok(i); i.onerror = mal; i.src = URL.createObjectURL(file); }); w = fuente.naturalWidth; h = fuente.naturalHeight; }
  const k = Math.min(1, MAX / Math.max(w, h)), c = document.createElement('canvas');

async function subirFotosInternas(parteId, asignacionId) {

// ---------- Ciudad y pueblo (se calculan de la dirección; SIGMA da la población con formatos distintos) ----------
const ABIERTOS = ['pendiente', 'asignado', 'en_curso', 'terminado'];

  const destino = new Map();
  for (const k of claves) {
    const g = grupos.get(k), base = k.split('|')[1];
    const mejor = claves.find((o) => {
      if (o === k || destino.has(o) || o.length <= k.length) return false;
      const og = grupos.get(o), ob = o.split('|')[1];
      if (og.ciudad !== g.ciudad) return false;
      if (base.length >= 8 && ob.startsWith(base)) return true;
      return base.split(' ')[0] === ob.split(' ')[0] && [...g.cps].some((c) => og.cps.has(c));
    });
    if (mejor) destino.set(k, mejor);
  }
  const final = (k) => (destino.has(k) ? final(destino.get(k)) : k);
  const resultado = new Map(); // clave final → { ciudad, etiqueta, ids:[] }
  filas.forEach((f) => {
    const k = final(f.clave), g = grupos.get(k);
    const r = resultado.get(k) || { ciudad: g.ciudad, etiqueta: titulo(g.nombre) + (sinTildes(g.nombre) === sinTildes(g.ciudad.toUpperCase()) ? ' (capital)' : ''), ids: [] };
    r.ids.push(f.p.id); resultado.set(k, r);
  });
  return resultado;
}
let cachePueblos = null;
async function cargarPueblos() {
  const { data, error } = await sb.from('partes').select('id, compania_id, codigo_postal, poblacion, sigma_cuenta, sigma_gremio, gremio').in('estado', ABIERTOS);
  if (error) throw error;
  const cat = catalogoPueblos(data || []);
  const puebloDe = new Map();
  cat.forEach((v, k) => v.ids.forEach((id) => puebloDe.set(id, k)));
  cachePueblos = { cat, abiertos: (data || []).map((p) => ({ ...p, ciudad: ciudadDe(p), pueblo: puebloDe.get(p.id) || '', gremioClave: claveGremio(p) })) };
}
// ---------- Gremio: código SIGMA + nombre ("02A ELECTRICISTA"); los partes manuales, por su texto ----------
function claveGremio(p) {
  const c = String(p.sigma_gremio || '').trim().toUpperCase();
  if (c) return 'S:' + c;
  const t = String(p.gremio || '').trim().toUpperCase();
  return t ? 'T:' + t : 'SIN';
}
function textoGremio(k) {
  if (k === 'SIN') return 'SIN GREMIO';
  if (k.startsWith('S:')) { const c = k.slice(2); return (c + ' ' + (codigo('gremio', c) || '')).trim().toUpperCase(); }
  return k.slice(2);
}
// Contadores de los filtros (servicios abiertos). Cada desplegable cuenta con los demás filtros
// de lugar, gremio y compañía aplicados, pero no con el suyo: así se ve cuántos hay en cada opción.
function abiertosSin(excepto) {
  const f = filtroPartes;
  return (cachePueblos?.abiertos || []).filter((p) =>
    (excepto === 'gremio' || !f.gremio || p.gremioClave === f.gremio) &&
    (excepto === 'cia' || !f.cia || String(p.compania_id) === String(f.cia)) &&
    (excepto === 'ciudad' || excepto === 'pueblo' || !f.ciudad || p.ciudad === f.ciudad) &&
    (excepto === 'ciudad' || excepto === 'pueblo' || !f.pueblo || p.pueblo === f.pueblo));
}
function contarPor(lista, campo) {
  const m = new Map();
  lista.forEach((p) => m.set(p[campo], (m.get(p[campo]) || 0) + 1));
  return m;
}
function pintarFiltrosLugar() {
  const cat = cachePueblos?.cat || new Map();
  const hay = !!cachePueblos;
  const n = (x) => (hay ? ` (${x})` : '');
  // Compañía
  const lCia = abiertosSin('cia'), porCia = contarPor(lCia, 'compania_id');
  $('#fp-cia').innerHTML = `<option value="">Todas las compañías${n(lCia.length)}</option>` +
    cache.companias.map((c) => `<option value="${c.id}">${esc(c.nombre)}${n(porCia.get(c.id) || 0)}</option>`).join('');
  $('#fp-cia').value = filtroPartes.cia;
  // Provincia
  const ciudades = [...new Set([...cat.values()].map((v) => v.ciudad))].sort((a, b) => (a === 'Otras') - (b === 'Otras') || a.localeCompare(b));
  if (filtroPartes.ciudad && !ciudades.includes(filtroPartes.ciudad)) filtroPartes.ciudad = '';
  const lProv = abiertosSin('ciudad'), porProv = contarPor(lProv, 'ciudad');
  $('#fp-ciudad').innerHTML = `<option value="">Todas las provincias${n(lProv.length)}</option>` +
    ciudades.map((c) => `<option value="${esc(c)}">${esc(c)}${n(porProv.get(c) || 0)}</option>`).join('');
  $('#fp-ciudad').value = filtroPartes.ciudad;
  // Pueblo (solo tras elegir provincia); con gremio o compañía, solo los pueblos que tienen alguno
  const lPue = abiertosSin('pueblo').filter((p) => !filtroPartes.ciudad || p.ciudad === filtroPartes.ciudad);
  const porPue = contarPor(lPue, 'pueblo');
  const pueblos = [...cat.entries()].filter(([k, v]) => (!filtroPartes.ciudad || v.ciudad === filtroPartes.ciudad) && (porPue.get(k) || k === filtroPartes.pueblo))
    .sort(([, a], [, b]) => b.etiqueta.endsWith('(capital)') - a.etiqueta.endsWith('(capital)') || a.ciudad.localeCompare(b.ciudad) || a.etiqueta.localeCompare(b.etiqueta, 'es'));
  if (filtroPartes.pueblo && !pueblos.some(([k]) => k === filtroPartes.pueblo)) filtroPartes.pueblo = '';
  const sinProv = !filtroPartes.ciudad;
  if (sinProv) filtroPartes.pueblo = '';
  $('#fp-pueblo').innerHTML = (sinProv ? '<option value="">Todos los pueblos (elige provincia)</option>' : `<option value="">Todos los pueblos${n(lPue.length)}</option>`)
    + (sinProv ? '' : pueblos.map(([k, v]) => `<option value="${esc(k)}">${esc(v.etiqueta)}${n(porPue.get(k) || 0)}</option>`).join(''));
  $('#fp-pueblo').value = filtroPartes.pueblo;
  $('#fp-pueblo').disabled = sinProv;
  $('#fp-pueblo').title = sinProv ? 'Elige primero una provincia' : '';
  // Gremio: código y nombre con nº de servicios abiertos (con provincia, pueblo y compañía elegidos)
  const lGre = abiertosSin('gremio'), cuenta = contarPor(lGre, 'gremioClave');
  if (filtroPartes.gremio && !cuenta.has(filtroPartes.gremio)) cuenta.set(filtroPartes.gremio, 0);
  const gremios = [...cuenta.entries()].sort(([a], [b]) => (a === 'SIN') - (b === 'SIN') || a.startsWith('T:') - b.startsWith('T:') || a.localeCompare(b, 'es'));
  $('#fp-gremio').innerHTML = `<option value="">Todos los gremios${n(lGre.length)}</option>` + gremios.map(([k, c]) => `<option value="${esc(k)}">${esc(textoGremio(k))} (${c})</option>`).join('');
  $('#fp-gremio').value = filtroPartes.gremio;
}

let ultimosPartes = [];
async function consultaPartes(limite) {
  let q = sb.from('partes').select('*, compania:companias(nombre), asignaciones!asignaciones_parte_id_fkey(fecha, operario_id)')
    .order('urgente', { ascending: false }).order('creado_en', { ascending: false }).limit(limite);
  if (filtroPartes.estado === 'abiertos') q = q.in('estado', ABIERTOS);
  else if (filtroPartes.estado !== 'todos') q = q.eq('estado', filtroPartes.estado);
  if (filtroPartes.cia) q = q.eq('compania_id', Number(filtroPartes.cia));
  if (filtroPartes.nuevos === '1') q = q.or(filtroNuevosHoy());
  else if (filtroPartes.nuevos === '0') q = q.or(filtroAnteriores());
  if (filtroPartes.pueblo && cachePueblos?.cat.get(filtroPartes.pueblo)) q = q.in('id', cachePueblos.cat.get(filtroPartes.pueblo).ids);
  else if (filtroPartes.ciudad) {
    const pr = Object.keys(PROVINCIAS_CP).find((k) => PROVINCIAS_CP[k] === filtroPartes.ciudad);
    const cuenta = filtroPartes.ciudad === 'Valladolid' ? 'VLL' : filtroPartes.ciudad === 'Palencia' ? 'PAL' : null;
    if (pr) q = q.or(`codigo_postal.like.${pr}%` + (cuenta ? `,and(codigo_postal.is.null,sigma_cuenta.eq.${cuenta})` : ''));
  }
  const g = filtroPartes.gremio;
  if (g === 'SIN') q = q.is('sigma_gremio', null).is('gremio', null);
  else if (g.startsWith('S:')) q = q.ilike('sigma_gremio', g.slice(2));
  else if (g.startsWith('T:')) q = q.is('sigma_gremio', null).ilike('gremio', g.slice(2));
  if (filtroPartes.texto) {
    const t = filtroPartes.texto.replace(/[,()%*]/g, ' ');
    q = q.or(`numero_servicio.ilike.%${t}%,direccion.ilike.%${t}%,asegurado.ilike.%${t}%,poblacion.ilike.%${t}%,telefono.ilike.%${t}%`);
  }
  return q;
}

function exportarPartes() {
  const cols = ['compania', 'numero_servicio', 'estado', 'urgente', 'gremio', 'asegurado', 'telefono', 'telefono2', 'telefono_perjudicado', 'telefono_perjudicado2', 'direccion', 'codigo_postal', 'poblacion', 'descripcion', 'creado_en'];
  const csvCelda = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const filas = ultimosPartes.map((p) => cols.map((c) => csvCelda(c === 'compania' ? p.compania?.nombre : c === 'estado' ? TXT_ESTADO[p.estado] : c === 'urgente' ? (p.urgente ? 'Sí' : 'No') : p[c])).join(';'));
  const blob = new Blob(['﻿' + [cols.join(';'), ...filas].join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `servicios-kubel-${hoyISO()}.csv`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
