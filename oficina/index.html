    direccion: val('pt-dir'), poblacion: val('pt-pob') || null, codigo_postal: val('pt-cp') || null,
    descripcion: val('pt-desc') || null, notas_oficina: val('pt-notas') || null,
    aseguradora: val('pt-aseguradora') || null, poliza: val('pt-poliza') || null,
    urgente: $('#pt-urg').checked, estado: val('pt-estado'),
  };
  if (!fila.numero_servicio || !fila.direccion) return alert('El nº de servicio y la dirección son obligatorios.');
  const { error } = id ? await sb.from('partes').update(fila).eq('id', id) : await sb.from('partes').insert(fila);
  if (error) return fallo(/duplicate key/.test(error.message) ? 'Ya existe un servicio con ese número en esa compañía.' : error);
  cerrarModal(); aviso(id ? 'Servicio guardado' : 'Servicio creado');
  irA(vistaActual);
}

// ===== [PRUEBAS] Borrar visita con informes — solo para testeos. Para quitarlo: borrar este bloque
// y volver a poner el alert en quitarAsignacion (buscar «[PRUEBAS]»). =====
async function borrarVisitaPrueba(id, parteId, nInf) {
  if (!confirm(`Esta visita tiene ${nInf} informe(s) del operario.\n\nSOLO PARA PRUEBAS: ¿borrar la visita, sus informes y sus fotos? No se puede deshacer.\n(Lo ya enviado a SIGMA no se deshace.)`)) return;
  if ((prompt('Para confirmar, escribe BORRAR') || '').trim().toUpperCase() !== 'BORRAR') return aviso('Cancelado');
  const { data: fs } = await sb.from('fotos').select('ruta').in('informe_id',
    ((await sb.from('informes').select('id').eq('asignacion_id', id)).data || []).map((i) => i.id));
  if (fs && fs.length) await sb.storage.from('fotos').remove(fs.map((f) => f.ruta));
  const { error } = await sb.from('asignaciones').delete().eq('id', id); // informes y fotos se borran en cascada
  if (error) return fallo(error);
  const { count } = await sb.from('asignaciones').select('id', { count: 'exact', head: true }).eq('parte_id', parteId);
  if (count === 0) await sb.from('partes').update({ estado: 'pendiente' }).eq('id', parteId).in('estado', ['asignado', 'en_curso', 'terminado']);
  cerrarModal(); aviso('Visita de prueba borrada'); irA(vistaActual);
}
// ===== [PRUEBAS] fin =====

// =====================================================================
//  INFORMES
// =====================================================================
let filtroInformes = { parte: null, fijada: false, soloNuevos: false, buscar: '', operario: '', limite: 300 };
let fotosVisor = [], idxVisor = 0, fotosInforme = {}, _turnoInf = 0;
const MESES_LARGOS = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];

// Abre la carpeta de un servicio en Informes (desde la ficha o desde Envíos a SIGMA)
function abrirCarpetaInformes(parteId) {
  Object.assign(filtroInformes, { parte: parteId, fijada: true, soloNuevos: false, buscar: '', operario: '' });
  if (location.hash === '#informes') vistaInformes(); else location.hash = '#informes';
}
function elegirCarpeta(parteId) {
  filtroInformes.parte = parteId; filtroInformes.fijada = false; vistaInformes();
  if (window.innerWidth <= 900) window.scrollTo({ top: 0 });
}
// Cajón del archivador según la fecha del último informe de la carpeta
function cajonInforme(ts) {
  const d = new Date(ts), h = new Date(); h.setHours(0, 0, 0, 0);
  const dias = Math.floor((h - new Date(d.getFullYear(), d.getMonth(), d.getDate())) / 86400000);
  if (dias <= 0) return 'Hoy';
  if (dias === 1) return 'Ayer';
  if (dias < 7) return 'Últimos 7 días';
  const m = MESES_LARGOS[d.getMonth()]; return m[0].toUpperCase() + m.slice(1) + (d.getFullYear() !== h.getFullYear() ? ' ' + d.getFullYear() : '');
}

// v2.37: Informes como archivador. A la izquierda, una carpeta por servicio (agrupadas por fecha del último informe);
// a la derecha, los informes con fotos de la carpeta abierta. Solo se cargan las fotos de esa carpeta.
async function vistaInformes() {
  const f = filtroInformes, turno = ++_turnoInf;
  if (esqueleto('informes', `
    <div class="barra"><h2>Informes</h2>
      <div id="inf-pest" class="pestanas"></div>
      <input id="inf-buscar" type="search" placeholder="Buscar servicio, dirección, pueblo…" style="max-width:280px">
      <select id="inf-op" style="max-width:200px"></select>
      <span class="esp"></span><button class="sec" onclick="marcarTodosRevisados()">Marcar todos como revisados</button>
    </div>
    <div class="archivador" id="inf-arch">
      <aside class="carpetas" id="inf-carpetas"><div class="vacio">Cargando…</div></aside>
      <section class="carpeta-abierta" id="inf-detalle"></section>
    </div>`)) {
    $('#inf-buscar').value = f.buscar;
    $('#inf-buscar').oninput = (e) => { filtroInformes.buscar = e.target.value; filtroInformes.fijada = false; vistaInformes(); };
    $('#inf-op').onchange = (e) => { filtroInformes.operario = e.target.value; filtroInformes.fijada = false; vistaInformes(); };
  }

  // Lista ligera (sin fotos) para montar las carpetas
  const { data, error } = await sb.from('informes')
    .select('id, parte_id, operario_id, creado_en, revisado, trabajo_terminado, necesita_repaso, parte:partes!informes_parte_id_fkey(id, numero_servicio, direccion, poblacion, compania:companias(nombre))')
    .order('creado_en', { ascending: false }).limit(f.limite);
  if (error) return fallo(error);
  if (turno !== _turnoInf) return;

  // Agrupar por servicio
  const mapa = new Map();
  for (const i of data) {
    if (!i.parte) continue;
    let c = mapa.get(i.parte_id);
    if (!c) mapa.set(i.parte_id, c = { parte: i.parte, ultimo: i, n: 0, sinRev: 0, ops: new Set() });
    c.n++; if (!i.revisado) c.sinRev++; c.ops.add(i.operario_id);
  }
  const todas = [...mapa.values()];
  const nSinRev = todas.filter((c) => c.sinRev).length;
  const ops = [...new Set(data.map((i) => i.operario_id))].map((id) => ({ id, nombre: nombreDe(id) })).sort((a, b) => a.nombre.localeCompare(b.nombre));
  morfar($('#inf-pest'), `
    <button class="${f.soloNuevos ? '' : 'activa'}" onclick="filtroInformes.soloNuevos=false;filtroInformes.fijada=false;vistaInformes()">Todas <small>${todas.length}</small></button>
    <button class="${f.soloNuevos ? 'activa' : ''}" onclick="filtroInformes.soloNuevos=true;filtroInformes.fijada=false;vistaInformes()">Sin revisar <small>${nSinRev}</small></button>`);
  morfar($('#inf-op'), `<option value="" ${f.operario ? '' : 'selected'}>Todos los operarios</option>` +
    ops.map((o) => `<option value="${o.id}" ${f.operario === o.id ? 'selected' : ''}>${esc(o.nombre)}</option>`).join(''));
  if (document.activeElement !== $('#inf-op')) $('#inf-op').value = f.operario;

  const q = f.buscar.trim().toLowerCase();
  const vis = todas.filter((c) => (!f.soloNuevos || c.sinRev) && (!f.operario || c.ops.has(f.operario)) &&
    (!q || [c.parte.numero_servicio, c.parte.direccion, c.parte.poblacion, c.parte.compania?.nombre].join(' ').toLowerCase().includes(q)));

  // Escritorio: si no hay carpeta elegida (o los filtros la ocultan), se abre la primera de la lista.
  // Si se llegó desde la ficha (fijada), se respeta aunque no esté entre los cargados.
  if (window.innerWidth > 900 && !f.fijada && !vis.some((c) => c.parte.id === f.parte)) f.parte = vis[0]?.parte.id || null;
  $('#inf-arch').classList.toggle('con-carpeta', !!f.parte);

  let html = '', cajon = '';
  for (const c of vis) {
    const k = cajonInforme(c.ultimo.creado_en);
    if (k !== cajon) { cajon = k; html += `<div class="cajon" data-k="cajon-${esc(k)}">${esc(k)}</div>`; }
    const u = c.ultimo;
    html += `<div class="carpeta ${c.parte.id === f.parte ? 'abierta' : ''} ${c.sinRev ? 'sin-revisar' : ''}" data-k="${c.parte.id}" onclick="elegirCarpeta('${c.parte.id}')">
      <div class="l1"><b>${esc(c.parte.numero_servicio)}</b>${c.sinRev ? `<span class="badge">${c.sinRev}</span>` : ''}<span class="esp"></span><small>${hace(u.creado_en)}</small></div>
      <div class="dir">${esc([c.parte.direccion, c.parte.poblacion].filter(Boolean).join(', '))}</div>
      <div class="met">${esc(nombreDe(u.operario_id))} · ${c.n} informe${c.n === 1 ? '' : 's'} · ${u.trabajo_terminado ? '<span class="ok">Terminado</span>' : '<span class="pend">Sin terminar</span>'}</div>
    </div>`;
  }
  if (!vis.length) html = `<div class="vacio">${f.soloNuevos ? 'No hay informes sin revisar 👍' : q || f.operario ? 'Ninguna carpeta coincide.' : 'Todavía no hay informes.'}</div>`;
  if (data.length >= f.limite) html += `<div class="mas" data-k="mas"><button class="sec mini" onclick="filtroInformes.limite+=300;vistaInformes()">Cargar informes más antiguos</button></div>`;
  morfar($('#inf-carpetas'), html);

  await pintarCarpeta(turno);
}

// Carpeta abierta: datos del servicio + sus informes con fotos (del más reciente al más antiguo)
async function pintarCarpeta(turno) {
  const f = filtroInformes, det = $('#inf-detalle');
  if (!f.parte) { morfar(det, `<div class="tarjeta vacio">Elige una carpeta de la izquierda.</div>`); fotosVisor = []; return; }
  const { data, error } = await sb.from('informes')
    .select('*, parte:partes!informes_parte_id_fkey(id, numero_servicio, direccion, poblacion, compania:companias(nombre)), fotos!fotos_informe_id_fkey(id, tipo, ruta)')
    .eq('parte_id', f.parte).order('creado_en', { ascending: false });
  if (error) return fallo(error);
  if (turno !== _turnoInf) return;
  const volver = `<button class="sec mini solo-movil" onclick="filtroInformes.parte=null;vistaInformes()">← Archivador</button>`;
  if (!data.length) { morfar(det, `${volver}<div class="tarjeta vacio">Este servicio no tiene informes.</div>`); fotosVisor = []; return; }

  const p = data[0].parte;
  const urls = await firmarFotos(data.flatMap((i) => i.fotos.map((x) => x.ruta)));
  if (turno !== _turnoInf) return;
  const orden = { antes: 0, despues: 1, factura: 2 };
  fotosVisor = []; fotosInforme = {};
  data.forEach((i) => { i.fotos.sort((a, b) => orden[a.tipo] - orden[b.tipo]); fotosInforme[i.id] = { servicio: p.numero_servicio, fecha: i.creado_en, fotos: i.fotos.map((x) => ({ ruta: x.ruta, tipo: x.tipo })) }; });
  const sinRev = data.filter((i) => !i.revisado).length;
  const repaso = data[0].necesita_repaso;

  morfar(det, `${volver}
    <div class="carpeta-cab" data-k="cab-${p.id}">
      <div><div class="num"><a href="#" onclick="modalParte('${p.id}');return false">${esc(p.numero_servicio)}</a></div>
        <div class="dir">${esc([p.direccion, p.poblacion].filter(Boolean).join(', '))}${p.compania?.nombre ? ' · ' + esc(p.compania.nombre) : ''}</div>
        <div class="met">${data.length} informe${data.length === 1 ? '' : 's'}${sinRev ? ` · <b style="color:var(--acento)">${sinRev} sin revisar</b>` : ''}</div></div>
      <span class="esp"></span>
      ${repaso ? `<button class="mini acento" onclick="modalAsignar({parteId:'${p.id}'})">Programar repaso</button>` : ''}
      ${sinRev ? `<button class="mini" onclick="marcarCarpetaRevisada('${p.id}')">Marcar carpeta revisada</button>` : ''}
      <button class="mini sec" onclick="modalParte('${p.id}')">Ficha del servicio</button>
    </div>
    ${data.map((i) => `
    <div class="tarjeta informe ${i.revisado ? '' : 'sin-revisar'}" data-k="${i.id}">
      <div class="cab">
        <b>${fHora(i.creado_en)}</b>
        <span style="color:var(--suave)">${esc(nombreDe(i.operario_id))}</span>
        ${i.trabajo_terminado ? '<span class="et terminado">Terminado</span>' : '<span class="et en_curso">Sin terminar</span>'}
        ${i.necesita_repaso ? '<span class="et pendiente">Necesita repaso</span>' : ''}
        ${i.importe_gastos ? `<span class="et">Factura ${euros(i.importe_gastos)}</span>` : ''}
        <span class="esp"></span>
        ${['antes', 'despues'].map((t) => { const n = i.fotos.filter((x) => x.tipo === t).length; return n ? `<button class="mini" onclick="descargarFotos('${i.id}', '${t}', this)" title="Descargar las ${n} fotos de ${t === 'antes' ? 'antes' : 'después'}">⬇ ${t === 'antes' ? 'Antes' : 'Después'} (${n})</button>` : ''; }).join('')}
        ${i.revisado ? `<span class="et revisado">✓ Revisado</span>` : `<button class="mini" onclick="marcarRevisado('${i.id}')">Marcar revisado</button>`}
      </div>
      <div class="txt">${esc(i.texto)}</div>
      ${i.fotos.length ? `<div class="fotos">${i.fotos.map((x) => {
        const n = fotosVisor.push({ url: urls[x.ruta], tipo: x.tipo, parte: p.numero_servicio }) - 1;
        return `<a href="#" onclick="abrirVisor(${n});return false"><img loading="lazy" src="${urls[x.ruta] || ''}" alt=""><span>${x.tipo === 'despues' ? 'después' : x.tipo}</span></a>`;
      }).join('')}</div>` : ''}
    </div>`).join('')}`);
}
async function marcarCarpetaRevisada(parteId) {
  const { error } = await sb.from('informes').update({ revisado: true }).eq('parte_id', parteId).eq('revisado', false);
  if (error) return fallo(error);
  contarSinRevisar(); vistaInformes();
}
// Descarga de golpe las fotos de un tipo (antes / despues) de un informe, como archivos sueltos:
// <servicio>_<tipo>_<n>.jpg. Chrome pide una vez «Permitir descargas múltiples» para kubelapp.github.io.
async function descargarFotos(id, tipo, boton) {
  const inf = fotosInforme[id]; const fotos = (inf?.fotos || []).filter((x) => x.tipo === tipo); if (!fotos.length) return;
  const txt = boton.textContent; boton.disabled = true; boton.textContent = 'Preparando…';
  try {
    const { data: firmadas, error } = await sb.storage.from('fotos').createSignedUrls(fotos.map((x) => x.ruta), 600);
    if (error) throw error;
    const base = String(inf.servicio || 'servicio').replace(/[^\w-]+/g, '_');
    let ok = 0;
    for (const [k, x] of fotos.entries()) {
      boton.textContent = `Descargando ${k + 1}/${fotos.length}…`;
      try {
        const url = firmadas?.find((f) => f.path === x.ruta)?.signedUrl; if (!url) throw new Error('sin enlace');
        const res = await fetch(url); if (!res.ok) throw new Error(res.status);
        const ext = (x.ruta.split('.').pop() || 'jpg').toLowerCase().slice(0, 5);
        const a = document.createElement('a'); a.href = URL.createObjectURL(await res.blob());
        a.download = `${base}_${tipo}_${k + 1}.${ext}`;
        document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 30000);
        ok++; await new Promise((v) => setTimeout(v, 350));
      } catch (e) { console.error(e); }
    }
    if (!ok) throw new Error('No se pudo descargar ninguna foto');
    aviso(ok < fotos.length ? `Descargadas ${ok} de ${fotos.length} fotos` : `Descargadas ${ok} fotos de ${tipo === 'antes' ? 'antes' : 'después'}`);
  } catch (e) { fallo(e); }
  finally { boton.disabled = false; boton.textContent = txt; }
}
async function marcarRevisado(id) {
  const { error } = await sb.from('informes').update({ revisado: true }).eq('id', id);
  if (error) return fallo(error);
  contarSinRevisar(); vistaInformes(); // solo cambia esa tarjeta (y el resto de ordenadores, por tiempo real)
}
async function marcarTodosRevisados() {
  if (!confirm('¿Marcar todos los informes como revisados?')) return;
  const { error } = await sb.from('informes').update({ revisado: true }).eq('revisado', false);
  if (error) return fallo(error);
  contarSinRevisar(); vistaInformes();
}
function abrirVisor(n) {
  idxVisor = n; const f = fotosVisor[n]; if (!f?.url) return;
  $('#visor').innerHTML = `<div class="visor" onmousedown="this._fuera=event.target===this" onclick="if(this._fuera&&event.target===this)cerrarVisor()">
    <img src="${f.url}" alt="">
    <div class="barra-v">
      <button onclick="abrirVisor((idxVisor-1+fotosVisor.length)%fotosVisor.length)">‹</button>
      <span>${esc(f.parte)} · ${f.tipo === 'despues' ? 'después' : f.tipo} · ${n + 1}/${fotosVisor.length}</span>
      <button onclick="abrirVisor((idxVisor+1)%fotosVisor.length)">›</button>
      <button onclick="window.open(fotosVisor[idxVisor].url,'_blank')">Abrir / descargar</button>
      <button onclick="cerrarVisor()">✕</button>
    </div></div>`;
}
function cerrarVisor() { $('#visor').innerHTML = ''; }
document.addEventListener('keydown', (e) => {
  if (!$('#visor').innerHTML) return;
  if (e.key === 'ArrowRight') abrirVisor((idxVisor + 1) % fotosVisor.length);
  if (e.key === 'ArrowLeft') abrirVisor((idxVisor - 1 + fotosVisor.length) % fotosVisor.length);
});

// Instalable como app
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
